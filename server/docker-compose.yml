name: musicapp

# Red propia: los contenedores de los túneles solo llegan a la API, no al resto del servidor.
services:
  api:
    build: .
    container_name: musicapp-api
    restart: unless-stopped
    environment:
      API_TOKEN: ${API_TOKEN:-}          # solo sus claves; las de los túneles se quedan en sus contenedores
      BOT_API_KEY: ${BOT_API_KEY:-}      # la del bot para /interno (puerto 8001)
      MUSIC_GB: "15"                     # tope de la biblioteca: al pasarlo borra lo que hace más que no suena
      GOOGLE_CLIENT_ID: 76813509622-rpbjrvn23rpjgrkulb051tjgids6f80j.apps.googleusercontent.com   # cliente OAuth web (no es secreto)
    ports:
      - "127.0.0.1:8090:8000"            # solo para pruebas desde este servidor
      - "127.0.0.1:8091:8001"            # rutas del bot (/interno), igual; el bot entra por la red interna
    volumes:
      - ./data:/data                                 # usuarios, sesiones y cookies de YouTube
      - /var/lib/music:/music                        # la biblioteca única (canciones + index.json)
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}

  tailscale:
    image: tailscale/tailscale:stable
    container_name: musicapp-tailscale
    hostname: musicapp                    # -> https://musicapp.<tailnet>.ts.net
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "true"                # sin privilegios ni acceso a la red del servidor
    volumes:
      - ./data/tailscale:/var/lib/tailscale
      - ./funnel.json:/config/serve.json:ro
    depends_on: [api]
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: musicapp-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run   # la dirección pública y el destino (api:8000) se configuran en el panel de Cloudflare
    environment:
      TUNNEL_TOKEN: ${CF_TUNNEL_TOKEN:-}
    depends_on: [api]
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}
