<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E0D16">
<title>Música</title>
<link rel="icon" href="/logo-96.webp" type="image/webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  /* La app en el navegador (mismo tema y mismas mecánicas que la app Flutter, sin lo que en web no aplica:
     descargas, caché sin conexión, notificación de Android, actualizador). */
  /* Temas (como la app, lib/theme.dart): las pantallas no llevan colores fijos, todo sale de estas variables; cambiar
     de tema es cambiar el atributo data-tema de <html>. El acento lo pone aplicarTema() (en Claro, oscurecido si es muy
     luminoso). Lo que va sobre una portada difuminada (reproductor grande y barra de lo que suena) es siempre oscuro. */
  :root, :root[data-tema="claro"] :is(.np, .bar) {
    --fondo: #0E0D16; --fondo-rgb: 14 13 22; --hoja: #1A1728; --barra: #15131F; --elevado: #2A2440;
    --texto: #FFFFFF; --texto2: rgb(255 255 255 / .6); --fg: 255 255 255;   /* fg: velos y bordes sobre el fondo */
    --cristal: rgb(255 255 255 / .06); --cristal2: rgb(255 255 255 / .1); --borde-cristal: rgb(255 255 255 / .18);
    --linea: rgb(255 255 255 / .08); --sombra: 1; --portada: .55; --invertir: invert(1);
    --luz1: rgb(139 92 246 / .35); --luz2: rgb(236 72 153 / .35); --luz3: rgb(59 130 246 / .35);
    --acento: var(--acento-o, #9B5CF6); --acento-rgb: var(--acento-o-rgb, 155 92 246); --sobre-acento: var(--sobre-acento-o, #FFFFFF);
    color-scheme: dark;
  }
  :root[data-tema="claro"] :is(.np, .bar) { color: var(--texto); }
  :root[data-tema="gris"] {
    --fondo: #111214; --fondo-rgb: 17 18 20; --hoja: #1E1F23; --barra: #2A2C31; --elevado: #2E3036;
    --texto2: rgb(255 255 255 / .55); --borde-cristal: rgb(255 255 255 / .2);
    --luz1: rgb(243 244 246 / .24); --luz2: rgb(var(--acento-rgb) / .13); --luz3: rgb(148 163 184 / .14);
  }
  :root[data-tema="claro"] {
    --fondo: #D9DEE6; --fondo-rgb: 217 222 230; --hoja: #E6E9EF; --barra: #E3E7ED; --elevado: #E9ECF1;
    --texto: #15171C; --texto2: rgb(0 0 0 / .55); --fg: 0 0 0;
    --cristal: rgb(241 243 247 / .85); --cristal2: #F6F7FA; --borde-cristal: rgb(0 0 0 / .08);
    --linea: rgb(0 0 0 / .08); --sombra: .3; --portada: .3; --invertir: none;
    --luz1: rgb(var(--acento-rgb) / .1); --luz2: rgb(147 197 253 / .12); --luz3: rgb(180 189 208 / .3);
    --acento: var(--acento-c); --acento-rgb: var(--acento-c-rgb); --sobre-acento: var(--sobre-acento-c);
    color-scheme: light;
  }
  :root { --radius: 14px; --gutter: 20px; --ease: cubic-bezier(.2, .7, .2, 1); --nav-h: 64px; }
  * { box-sizing: border-box; margin: 0; }
  html { background: var(--fondo); color: var(--texto); overflow-x: hidden; }
  /* barras de scroll finas, redondeadas y casi invisibles (no como las de un documento) */
  * { scrollbar-width: thin; scrollbar-color: rgb(var(--fg) / .14) transparent; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgb(var(--fg) / .12); border-radius: 8px; border: 2px solid transparent; background-clip: padding-box; }
  ::-webkit-scrollbar-thumb:hover { background: rgb(var(--fg) / .22); background-clip: padding-box; }
  body { background: transparent; color: var(--texto); overflow-x: hidden; }   /* sin fondo: si no, tapa la capa de color (.bg) */
  body { font-family: Inter, Roboto, system-ui, sans-serif; -webkit-font-smoothing: antialiased; min-height: 100vh; }
  body.locked { overflow: hidden; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  button:disabled { opacity: .4; cursor: default; }
  img { display: block; }
  .glass { background: var(--cristal); border: 1px solid var(--borde-cristal); backdrop-filter: blur(18px) saturate(140%);
           -webkit-backdrop-filter: blur(18px) saturate(140%); }

  /* Fondo: manchas de color quietas detrás del cristal */
  .bg { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
  .bg i { position: absolute; border-radius: 50%; }
  .bg i:nth-child(1) { width: 70vmax; height: 70vmax; left: -25vmax; top: -30vmax; background: radial-gradient(closest-side, var(--luz1), transparent); }
  .bg i:nth-child(2) { width: 55vmax; height: 55vmax; right: -20vmax; top: 15vh; background: radial-gradient(closest-side, var(--luz2), transparent); }
  .bg i:nth-child(3) { width: 60vmax; height: 60vmax; left: 5vw; bottom: -32vmax; background: radial-gradient(closest-side, var(--luz3), transparent); }
  /* La portada de lo que suena, muy desenfocada, tiñe el fondo (y el cristal deja verla) */
  .bg b { position: absolute; inset: -10%; background-size: cover; background-position: center; filter: blur(70px) saturate(160%);
          opacity: 0; transition: opacity 600ms ease, background-image 600ms ease; }
  .bg b.on { opacity: var(--portada); }
  .bg::after { content: ""; position: absolute; inset: 0; background: linear-gradient(rgb(var(--fondo-rgb) / .1), rgb(var(--fondo-rgb) / .45) 55%, rgb(var(--fondo-rgb) / .8)); }

  .wrap { max-width: 920px; margin: 0 auto; padding: 0 var(--gutter) calc(var(--nav-h) + 110px); }
  header { display: flex; align-items: center; gap: 14px; padding: 24px 0 6px; }
  header .hi { flex: 1; min-width: 0; }
  header h1 { font-size: 1.6rem; font-weight: 800; letter-spacing: -.3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header h1 span { color: var(--acento); }
  header p { color: var(--texto2); margin-top: 4px; font-size: .95rem; }
  .avatar { width: 42px; height: 42px; border-radius: 50%; background: var(--elevado); object-fit: cover; border: 1px solid var(--linea);
            display: grid; place-items: center; font-weight: 800; }
  span.avatar { background: linear-gradient(135deg, var(--acento), rgb(var(--acento-rgb) / .55)); color: var(--sobre-acento); }
  .menu { position: relative; }
  .menu-list { position: absolute; right: 0; top: 50px; z-index: 30; min-width: 240px; padding: 6px; border-radius: var(--radius);
    background: var(--hoja); box-shadow: 0 16px 40px rgb(0 0 0 / calc(.45 * var(--sombra)));
    opacity: 0; transform: translateY(-6px); pointer-events: none; transition: 200ms var(--ease); }
  .menu-list.on { opacity: 1; transform: none; pointer-events: auto; }
  .menu-list button { display: flex; gap: 10px; align-items: center; width: 100%; padding: 11px 12px; border-radius: 10px; text-align: left; font-size: .95rem; }
  .menu-list button:hover { background: rgb(var(--fg) / .06); }
  .menu-list small { color: var(--texto2); display: block; font-size: .78rem; }

  .apk { display: none; margin: 14px 0 4px; padding: 14px 16px; border-radius: var(--radius); align-items: center; gap: 12px;
         background: linear-gradient(120deg, rgb(var(--acento-rgb) / .24), rgb(var(--acento-rgb) / .08)); }
  .apk.on { display: flex; }
  .apk div { flex: 1; font-size: .9rem; line-height: 1.4; } .apk div b { display: block; font-size: .98rem; }
  .apk .go { background: var(--acento); color: var(--sobre-acento); padding: 9px 14px; border-radius: 999px; font-weight: 600; font-size: .88rem; }
  .apk .x { color: var(--texto2); padding: 4px 6px; }

  h2 { font-size: 1.12rem; font-weight: 700; margin: 24px 0 12px; display: flex; align-items: center; gap: 10px; }
  h2 small { margin-left: auto; color: var(--texto2); font-weight: 400; font-size: .85rem; }
  h2 .link { margin-left: auto; color: var(--acento); font-weight: 600; font-size: .88rem; }
  .back { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; flex: none; transition: background 200ms; }
  .back.glass { background: rgb(var(--fg) / .09); border-color: rgb(var(--fg) / .14); }
  .back.glass:hover { background: rgb(var(--fg) / .16); }
  .back svg { margin-left: -2px; }
  .sub { color: var(--texto2); font-size: .88rem; margin: -6px 0 14px; }
  .title-big { font-size: 1.6rem; font-weight: 800; margin-top: 22px; display: flex; align-items: center; gap: 10px; }
  .title-big .add { margin-left: auto; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-size: 1.4rem; }
  .title-big .add + .add { margin-left: 0; }
  .title-big .add.imp { font-size: 1.05rem; }

  /* Cabecera de una lista (playlist, álbum, artista): portada, nombre, datos y ▶ */
  .hero { display: flex; gap: 18px; align-items: center; margin: 18px 0 10px; }
  .hero img, .hero .ph { width: 132px; height: 132px; border-radius: 16px; object-fit: cover; background: var(--elevado); flex: none;
                         box-shadow: 0 14px 40px rgb(0 0 0 / calc(.45 * var(--sombra))); }
  .hero.round img { border-radius: 50%; }
  .hero .info { flex: 1; min-width: 0; }
  .hero h3 { font-size: 1.5rem; font-weight: 800; line-height: 1.2; overflow-wrap: anywhere; }
  .hero p { color: var(--texto2); font-size: .9rem; margin-top: 6px; }
  .hero p a { color: var(--acento); cursor: pointer; }
  .hero .acts, #lib > .acts { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .pill { padding: 9px 16px; border-radius: 999px; font-weight: 600; font-size: .9rem; }
  .pill.main { background: var(--acento); color: var(--sobre-acento); box-shadow: 0 6px 20px rgb(var(--acento-rgb) / .35); }
  @media (max-width: 560px) { .hero img, .hero .ph { width: 100px; height: 100px; } .hero h3 { font-size: 1.25rem; } }

  /* Carruseles horizontales (Inicio) */
  .rail { display: flex; gap: 14px; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 4px; scrollbar-width: none; }
  .rail::-webkit-scrollbar { display: none; }
  .rail > * { scroll-snap-align: start; flex: none; width: 150px; }
  /* Flechas para mover las filas con el ratón (en el móvil se desliza con el dedo) */
  .rail-box { position: relative; }
  .rail-arrow { position: absolute; top: 56px; z-index: 5; width: 40px; height: 40px; border-radius: 50%; display: none; place-items: center;
                background: color-mix(in srgb, var(--hoja) 90%, transparent); border: 1px solid var(--borde-cristal); box-shadow: 0 6px 20px rgb(0 0 0 / calc(.45 * var(--sombra)));
                backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); opacity: 0; transition: opacity 200ms, background 200ms; }
  .rail-arrow:hover { background: var(--elevado); }
  .rail-arrow.l { left: -12px; } .rail-arrow.r { right: -12px; }
  .rail-arrow svg { width: 20px; height: 20px; }
  @media (hover: hover) and (pointer: fine) {
    .rail-arrow { display: grid; pointer-events: none; }
    .rail-arrow.on { opacity: .55; pointer-events: auto; }   /* siempre a la vista si hay más hacia ese lado */
    .rail-box:hover .rail-arrow.on { opacity: 1; }
  }
  .card { display: flex; flex-direction: column; justify-content: flex-start; text-align: left; border-radius: var(--radius); overflow: hidden; transition: transform 200ms var(--ease), background 200ms; }
  .card:hover { transform: translateY(-2px); background: var(--cristal2); }
  /* ⋮ de las tarjetas de canciones: el menú (a continuación, al final de la cola, playlist…) sin cambiar la lista que
     suena; tocar la tarjeta la pone a sonar. En el PC sale al pasar por encima; también con clic derecho o dejándola pulsada */
  .card { position: relative; }
  .card .cmenu { position: absolute; bottom: 8px; right: 4px; z-index: 1; width: 30px; height: 30px; border-radius: 50%; display: grid;
                 place-items: center; color: var(--texto2); font-size: 20px; font-weight: 700; line-height: 1; transition: background 150ms; }
  .card .cmenu:hover { background: var(--cristal2); color: var(--texto); }
  .card:has(.cmenu) div { padding-right: 34px; }   /* abajo a la derecha, junto al título: que el texto no se meta debajo */
  @media (hover: hover) { .card .cmenu { opacity: 0; transition: opacity 150ms; } .card:hover .cmenu, .card:focus-visible .cmenu { opacity: 1; } }
  .card img, .card .ph { width: 100%; aspect-ratio: 1; object-fit: cover; background: var(--elevado); }
  .card .ph { display: grid; place-items: center; font-size: 2.2rem; color: var(--texto2); }
  .card.round img { border-radius: 50%; width: calc(100% - 24px); margin: 12px auto 0; }
  .card div { padding: 10px 12px 12px; }
  .card b { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; font-size: .92rem; font-weight: 600;
            line-height: 1.25; overflow: hidden; overflow-wrap: anywhere; }   /* hasta 2 líneas: «Mariposa Traicionera» entero */
  .card small { color: var(--texto2); font-size: .8rem; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }

  /* Arriba solo flota la caja, redondeada y de cristal como la barra de abajo (sin franja detrás) */
  .search { position: sticky; top: 12px; z-index: 20; margin-top: 12px; }
  .search .chips { padding-bottom: 6px; }
  /* Sugerencias mientras se escribe: un cuadro flotante bajo el buscador (como Spotify); la lista de abajo no cambia */
  .search .sugg { position: absolute; left: 0; right: 0; top: 56px; z-index: 30; max-height: 60vh; overflow-y: auto;
                  padding: 6px; border-radius: 16px; background: var(--hoja); border: 1px solid var(--linea);
                  box-shadow: 0 18px 50px rgb(0 0 0 / calc(.55 * var(--sombra))); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); }
  .sugg button { display: flex; align-items: center; gap: 12px; width: 100%; padding: 8px 10px; border-radius: 10px; text-align: left; }
  .sugg button:hover, .sugg button.sel { background: rgb(var(--fg) / .07); }
  .sugg img, .sugg .ic { width: 40px; height: 40px; border-radius: 8px; object-fit: cover; flex: none; background: var(--elevado);
                         display: grid; place-items: center; }
  .sugg .artista img { border-radius: 50%; }
  .sugg .tx { flex: 1; min-width: 0; } .sugg .tx b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sugg .tx small { color: var(--texto2); font-size: .8rem; }
  .search .chip { background: color-mix(in srgb, var(--hoja) 94%, transparent); border-color: var(--borde-cristal); box-shadow: 0 4px 18px rgb(0 0 0 / calc(.35 * var(--sombra))); }
  .search .chip.on { background: var(--acento); }
  .field { display: flex; align-items: center; gap: 10px; height: 54px; padding: 0 20px; border-radius: 999px;
           background: color-mix(in srgb, var(--hoja) 90%, transparent); border: 1px solid var(--borde-cristal); box-shadow: 0 6px 40px rgb(0 0 0 / calc(.4 * var(--sombra)));
           backdrop-filter: blur(18px) saturate(140%); -webkit-backdrop-filter: blur(18px) saturate(140%);
           transition: border-color 200ms, background 200ms, box-shadow 200ms; }
  .field:focus-within { border-color: rgb(var(--acento-rgb) / .8); box-shadow: 0 0 0 4px rgb(var(--acento-rgb) / .18), 0 6px 40px rgb(0 0 0 / calc(.4 * var(--sombra))); }
  .field input { flex: 1; min-width: 0; height: 100%; background: none; border: 0; outline: 0; color: var(--texto); font: inherit; }
  .field input::placeholder { color: var(--texto2); }
  .field input::-webkit-search-cancel-button { filter: var(--invertir); }
  .chips { display: flex; gap: 8px; margin-top: 12px; overflow-x: auto; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chips.wrapped { flex-wrap: wrap; overflow: visible; }
  .chip { flex: none; padding: 8px 16px; border-radius: 999px; color: var(--texto2); font-size: .9rem; transition: background 200ms, color 200ms; }
  .chip.on { background: var(--acento); color: var(--sobre-acento); font-weight: 600; border-color: transparent; }

  .list { display: flex; flex-direction: column; gap: 2px; }
  /* columna de álbum en las listas anchas (.cols), entre la canción y la duración */
  .row .alb { display: none; }
  @media (min-width: 1100px) {
    .list.cols .row .alb { display: block; flex: 0 0 28%; min-width: 0; color: var(--texto2); font-size: .85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .list.cols .row .meta { flex: 1 1 0; }
    .list.cols .row .alb-in { display: none; }   /* el álbum ya va en su columna */
    .list.cols .row .d { width: 3.4em; text-align: right; }

  }
  /* Inicio: paneles de listas (lado a lado en pantallas anchas), "Retoma tu música" y franjas pequeñas */
  .duo { display: grid; grid-template-columns: 1fr; gap: 16px; margin-top: 18px; }
  @media (min-width: 900px) { .duo { grid-template-columns: 1fr 1fr; } }
  .lpanel { border-radius: 22px; padding: 14px 10px 10px; min-width: 0; }
  .lp-cab { display: flex; align-items: center; gap: 10px; padding: 2px 10px 8px; }
  .lp-cab h3 { flex: 1; font-size: 1.1rem; font-weight: 800; } .lp-cab h3 small { color: var(--texto2); font-weight: 600; font-size: .8rem; }
  .lp-ico { width: 22px; height: 22px; color: var(--acento); display: grid; place-items: center; } .lp-ico svg { width: 22px; height: 22px; }
  .lp-ver { color: var(--acento); font-weight: 700; font-size: .9rem; }
  .lpanel .row { padding: 6px 8px; } .lpanel .row + .row { box-shadow: inset 0 1px 0 var(--linea); }
  .lpanel .row img, .lpanel .row .ph { width: 42px; height: 42px; }
  .lpanel .row .t { -webkit-line-clamp: 1; }
  .lpanel .row.playing { background: rgb(var(--acento-rgb) / .12); }
  .retoma { display: flex; align-items: center; gap: 18px; margin-top: 8px; flex-wrap: wrap; }
  .retoma h2 { margin: 0; flex: none; }
  .retoma-f { flex: 1; min-width: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
  .retoma-c { display: flex; align-items: center; gap: 12px; padding: 8px; border-radius: 16px; text-align: left; min-width: 0; }
  .retoma-c img, .retoma-c .ph { width: 52px; height: 52px; border-radius: 10px; object-fit: cover; background: var(--elevado); flex: none; }
  .retoma-c span { min-width: 0; } .retoma-c b { display: block; font-size: .92rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .retoma-c small { display: block; color: var(--texto2); font-size: .8rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .retoma-c:hover { background: var(--cristal2); }
  @media (max-width: 899px) {   /* estrecho: el título arriba y las tres en una fila que se desliza */
    .retoma { flex-direction: column; align-items: stretch; gap: 10px; }
    .retoma-f { display: flex; overflow-x: auto; scrollbar-width: none; } .retoma-f::-webkit-scrollbar { display: none; }
    .retoma-c { flex: none; width: 230px; }
  }
  /* franjas pequeñas (álbumes, artistas): tarjetas horizontales, no portadas grandes */
  .rail.mini > * { width: 230px; flex-direction: row; align-items: center; }
  .rail.mini .card img { width: 64px; height: 64px; aspect-ratio: auto; flex: none; border-radius: 12px; margin: 8px 0 8px 8px; }
  .rail.mini .card.round img { border-radius: 50%; width: 56px; height: 56px; margin: 8px 0 8px 10px; }
  .rail.mini .card div { padding: 8px 12px; min-width: 0; } .rail.mini .card b { -webkit-line-clamp: 1; }
  .chips.una { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; } .chips.una::-webkit-scrollbar { display: none; }
  .chips.una .chip { flex: none; }
  .chips.orden { align-items: center; } .chips-et { color: var(--texto2); font-size: .8rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; margin-right: 4px; }
  /* Biblioteca: playlists y artistas en filas compactas (dos columnas en pantallas anchas) */
  .grid.filas { grid-template-columns: 1fr; gap: 10px; }
  @media (min-width: 900px) { .grid.filas { grid-template-columns: 1fr 1fr; } }
  .grid.filas .card { flex-direction: row; align-items: center; }
  .grid.filas .card img, .grid.filas .card .ph { width: 64px; height: 64px; aspect-ratio: auto; flex: none; border-radius: 12px; margin: 8px 0 8px 8px; font-size: 1.4rem; }
  .grid.filas .card.round img { border-radius: 50%; width: 56px; height: 56px; margin: 8px 0 8px 10px; }
  .grid.filas .card div { padding: 8px 14px; min-width: 0; } .grid.filas .card b { -webkit-line-clamp: 1; }
  .title-big .pill { font-size: .9rem; } .title-big .pill.imp { margin-left: auto; }
  .hero .kebab.glass { width: 42px; height: 42px; }
  .row { display: flex; align-items: center; gap: 6px; padding: 8px; border-radius: 12px; width: 100%; transition: background 200ms; }
  .row:hover { background: rgb(var(--fg) / .045); }
  .row.playing .t { color: var(--acento); }
  .row[hidden] { display: none; }
  .row.past { opacity: .45; } .row.past:hover { opacity: .8; }
  .row .tag { color: var(--acento); font-weight: 600; font-size: .78em; }
  [data-qrow] { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
  [data-qrow] .grip { display: none; padding: 10px 8px; font-size: 1.25rem; line-height: 1; color: var(--texto2);
    cursor: grab; touch-action: none; }   /* sin touch-action el móvil lo tomaría por scroll */
  [data-qrow]:not(.past):not(.playing) .grip { display: block; }

  @media (max-width: 560px) { .time, .ctl.side { display: none; } }

  /* Reproductor grande */
  .np { position: fixed; inset: 0; z-index: 60; display: flex; justify-content: center; overflow-y: auto; background: var(--fondo);
        transform: translateY(100%); transition: transform 320ms var(--ease); }
  .np.on { transform: none; }
  .np .tint { position: fixed; inset: -10%; background-size: cover; background-position: center; filter: blur(80px) saturate(150%);
              opacity: .5; pointer-events: none; }
  .np .tint::after { content: ""; position: absolute; inset: 0; background: linear-gradient(rgb(var(--fondo-rgb) / .25), rgb(var(--fondo-rgb) / .85)); }
  .np .in { position: relative; width: 100%; max-width: 560px; padding: 14px 22px calc(30px + env(safe-area-inset-bottom)); }
  .np .top { display: flex; align-items: center; color: var(--texto2); font-size: .9rem; }

  .np .ahora { display: flex; align-items: center; justify-content: center; gap: 10px; letter-spacing: .3px; }
  .eq { display: inline-flex; align-items: flex-end; gap: 3px; height: 14px; }
  .eq b { width: 3px; height: 100%; border-radius: 2px; background: linear-gradient(rgb(var(--acento-rgb) / .6), var(--acento));
          transform-origin: bottom; transform: scaleY(.3); animation: eq 1s ease-in-out infinite alternate; animation-play-state: paused; }
  .eq b:nth-child(2) { animation-duration: .8s; animation-delay: -.3s; } .eq b:nth-child(3) { animation-duration: 1.2s; animation-delay: -.6s; }
  .eq b:nth-child(4) { animation-duration: .9s; animation-delay: -.2s; }
  .np.sonando .eq b { animation-play-state: running; }
  @keyframes eq { from { transform: scaleY(.25); } to { transform: scaleY(1); } }
  .np .cover { width: min(100%, 420px); aspect-ratio: 1; margin: 16px auto 0; border-radius: 20px; overflow: hidden;
               background: var(--elevado); box-shadow: 0 24px 60px rgb(0 0 0 / .55); }
  /* Portada viva: la portada se acerca y se mueve muy despacio (Ken Burns) y el fondo "respira", solo mientras suena.
     Todo CSS: sin vídeo ni peticiones. Es lo que se ve cuando la canción no tiene Canvas (más abajo). */
  .np .cover img { width: 100%; height: 100%; object-fit: cover; display: block; transform-origin: 50% 45%;
                   animation: portadaViva 24s ease-in-out infinite alternate; animation-play-state: paused; }
  .np .tint { animation: respira 9s ease-in-out infinite alternate; animation-play-state: paused; }
  .np.sonando .cover img, .np.sonando .tint { animation-play-state: running; }
  @keyframes portadaViva { 0% { transform: scale(1.02) translate(0, 0) rotate(0deg); }

  /* Canvas: 7 s del videoclip de fondo, en bucle y sin sonido, como en Spotify; la portada deja su sitio al vídeo.
     Sin Canvas (o con "reducir movimiento"), la portada viva de arriba. */
  /* El vídeo va detrás de la "escena" (portada, títulos, controles y la barra de pestañas), no de la letra ni la cola:
     --escena la pone ajustaEscena(). Con Canvas la portada crece para que no quede hueco vacío debajo. */
  .np .canvas { position: absolute; top: 0; left: 0; right: 0; height: var(--escena, 100%); z-index: -1;
                pointer-events: none; opacity: 0; transition: opacity 700ms var(--ease); }

  .np .canvas::after { content: ""; position: absolute; inset: 0;

                          no acabe en seco al bajar a la cola o la letra */
                       background: linear-gradient(rgb(0 0 0 / .32), rgb(0 0 0 / .08) 18%, rgb(0 0 0 / .08) 55%,

             place-items: center; color: #fff; background: rgb(0 0 0 / .4); opacity: .65; transition: opacity 200ms;
             backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }

  /* Sobre el vídeo: Siguiente / Letra en una cajita de cristal flotante (como la barra de Inicio, Buscar y Biblioteca),

  .np.con-canvas .tabs { margin: 18px 0 0; padding: 0; top: 10px; border: 1px solid var(--borde-cristal); border-radius: 18px;
                         background: color-mix(in srgb, var(--barra) 70%, transparent);
                         backdrop-filter: blur(18px) saturate(140%); -webkit-backdrop-filter: blur(18px) saturate(140%);
                         box-shadow: 0 10px 34px rgb(0 0 0 / calc(.35 * var(--sombra))); }

  .np.con-canvas :is(.top, .titles, .seek, .times, .ctls, .vol, .disps) { --texto: #fff; --texto2: rgb(255 255 255 / .78); color: var(--texto); }
  .np.con-canvas h3 { color: #fff; }
  .np.con-canvas .disp.fuera { color: var(--acento); }
  .np.con-canvas :is(.titles, .times, .top) { text-shadow: 0 1px 10px rgb(0 0 0 / .55); }

  :is(.np, .ahv) .disp.solo:hover { opacity: 1; }
  .bar .en { color: var(--acento); font-size: .74rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sheet .opt.dsp-on { color: var(--acento); }

                background: var(--cristal2); color: inherit; }

  .sheet .nota { color: var(--texto2); font-size: .85rem; line-height: 1.45; padding: 6px 14px 10px; }
  .np .titles div { flex: 1; min-width: 0; }
  .np h3 { font-size: 1.45rem; font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .np .art { color: var(--texto2); margin-top: 4px; cursor: pointer; display: inline-block; }

  .np .heart { width: 44px; height: 44px; } .np .heart svg { width: 26px; height: 26px; }
  .seek { width: 100%; margin-top: 18px; accent-color: var(--acento); cursor: pointer; }
  .np .times { display: flex; justify-content: space-between; color: var(--texto2); font-size: .78rem; margin-top: 2px; }
  .np .ctls { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; }
  .np .ctls .ctl svg { width: 28px; height: 28px; }
  .np .ctls .ctl.main { width: 68px; height: 68px; } .np .ctls .ctl.main svg { width: 34px; height: 34px; }
  .np .tabs { display: flex; margin-top: 18px; border-top: 1px solid var(--linea); border-bottom: 1px solid var(--linea);
              /* pegada arriba al bajar: la letra pasa por debajo y "ocultar letra" (o "Siguiente") siempre a la vista */
              position: sticky; z-index: 3; top: calc(-1 * var(--np-pad)); border-top: 0;
              padding: var(--np-pad) var(--np-x) 0; margin: calc(18px - var(--np-pad)) calc(-1 * var(--np-x)) 0;
              background: var(--np-bg); }

                     background: linear-gradient(var(--np-bg), transparent); }   /* la letra se desvanece al pasar por debajo */
  .np .in { --np-pad: 14px; --np-x: 22px; --np-bg: var(--fondo); }
  .np .tabs button { flex: 1; padding: 14px 0; color: var(--texto2); font-weight: 600; position: relative; }
  .np .tabs button.on { color: var(--acento); }
  .np .tabs button.on::after { content: ""; position: absolute; left: 35%; right: 35%; bottom: -1px; height: 3px; border-radius: 3px; background: var(--acento); }
  .np .radio { display: flex; align-items: center; gap: 12px; padding: 14px 8px; }
  .np .radio div { flex: 1; } .np .radio small { display: block; color: var(--texto2); font-size: .82rem; margin-top: 2px; }
  .switch { width: 46px; height: 26px; border-radius: 999px; background: var(--elevado); position: relative; flex: none; transition: background 200ms; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--texto2); transition: 200ms var(--ease); }

  /* Hojas (menú ⋮, elegir playlist, nombre) */
  /* Pantallas anchas (PC): el contenido a la izquierda y el reproductor grande fijo a la derecha, como Spotify en el

  .np .vacio { display: none; }

    /* Tarjeta flotante con aire alrededor, esquinas redondeadas y un brillo del color de la portada */
    .np { top: var(--pgap); right: var(--pgap); bottom: var(--pgap); left: auto; width: var(--panel); transform: none !important;
          z-index: 50; border-radius: 30px; overflow: hidden; justify-content: stretch;
          background: linear-gradient(180deg, color-mix(in srgb, var(--hoja) 94%, transparent), color-mix(in srgb, var(--fondo) 96%, transparent));
          border: 1px solid var(--linea);

    /* sin desplazamiento: la portada (o el Canvas) llena lo que quede; las pestañas Siguiente | Letra siempre a la

    .np .in { display: flex; flex-direction: column; overflow: hidden; }

    .np .in > .tabs { position: relative; top: auto; margin: 12px 0 0; padding: 0; border: 1px solid var(--borde-cristal); border-radius: 18px;
                      background: color-mix(in srgb, var(--barra) 70%, transparent);
                      backdrop-filter: blur(18px) saturate(140%); -webkit-backdrop-filter: blur(18px) saturate(140%);
                      box-shadow: 0 10px 34px rgb(0 0 0 / calc(.35 * var(--sombra))); }

    .np.abierto .in > #npPanel { display: block; flex: 1 1 0; min-height: 0; overflow-y: auto; scrollbar-width: thin; padding-top: 6px; }
    /* abierta: arriba los controles con el Canvas de fondo; abajo el panel con todo el sitio libre (a medias con la

  /* ---- Barra limpia (PC, fuera de Ahora; docs/afina-barra-limpia-20261106): una sola fila abajo con la navegación,

     ±10 s, Me gusta, menú); el progreso, una línea fina arriba de la zona de reproducción. Es el minirreproductor de
     siempre (mismos botones y manejadores), junto a la navegación. El reproductor de la derecha queda limpio: solo el

  .bar-acc, .np-cab, .bar-info { display: none; }
  @media (min-width: 1100px) {

    } catch (e) { if (e.status === 0) return false; }   // sin conexión: se queda para luego; otro error: se descarta
    delete pendingFavs[id]; store.set('favs_pendientes', pendingFavs);
  }
  return true;
}
function toggleFav(s) {
  const on = favs.has(s.id);
  on ? favs.delete(s.id) : favs.set(s.id, s);
  pendingFavs[s.id] = {add: !on, song: ficha(s)}; store.set('favs_pendientes', pendingFavs);
  paintHearts();
  toast(on ? 'Quitada de Me gusta' : 'Añadida a Me gusta');
  flushFavs();
}

function paintHearts() {
  document.querySelectorAll('.heart[data-id]').forEach(h => { const on = favs.has(h.dataset.id); h.classList.toggle('on', on); h.innerHTML = HEART(on); });

async function loadPls() { try { pls = (await api('/playlists')).playlists; } catch (e) {} return pls; }
async function savePl(p) {
  await api('/playlists/' + encodeURIComponent(p.id), {method: 'PUT', body: JSON.stringify({name: p.name, songs: p.songs.map(ficha)})});
}
async function newPl(name, song) {
  const {id} = await api('/playlists', {method: 'POST', body: JSON.stringify({name})});
  const p = {id, name, songs: song ? [song] : []};
  if (song) await savePl(p);
  pls.unshift(p);
  return p;
}
async function addToPl(p, s) {
  if (p.songs.some(x => x.id === s.id)) return toast('Ya estaba en ' + p.name);
  p.songs.push(s);

  catch (e) { p.songs.pop(); toast('No se pudo guardar'); }
}

// Importar una playlist o un Mix de YouTube / YouTube Music (como la app): el servidor la lee (/import/youtube) y
// marca lo que ya está guardado; lo demás queda "de internet" y se baja al sonar. Nada se guarda hasta "Guardar playlist".
function importPl(initial = '') {
  sheet(`<h4>Importar playlist de YouTube</h4><p class="sub" style="margin:4px 12px 10px">Pega el enlace de una playlist o un Mix de YouTube o YouTube Music.</p>
    <input id="nm" value="${esc(initial)}" placeholder="https://www.youtube.com/playlist?list=…" maxlength="500">
    <div class="btns"><button class="pill glass" id="nmNo">Cancelar</button><button class="pill main" id="nmOk">Importar</button></div>`);
  const ok = () => { const v = $('nm').value.trim(); if (v) readImport(v); };
  $('nm').focus(); $('nm').onkeydown = e => { if (e.key === 'Enter') ok(); };
  $('nmOk').onclick = ok; $('nmNo').onclick = closeSheet;
}
async function readImport(url) {
  sheet(`<h4>Importar playlist de YouTube</h4><p class="sub" style="margin:4px 12px 14px">Leyendo la playlist…</p>`);
  let j;
  try { j = await api('/import/youtube?url=' + encodeURIComponent(url)); }
  catch (e) {
    if (!$('scrim').classList.contains('on')) return;   // la cerró mientras tanto
    sheet(`<h4>No se pudo importar</h4><p class="sub" style="margin:4px 12px 14px">${esc(e.status === 0 ? 'Sin conexión' : e.message || 'Algo falló')}</p>
      <div class="btns"><button class="pill glass" id="cNo">Cerrar</button><button class="pill main" id="cOk">Otro enlace</button></div>`);
    $('cNo').onclick = closeSheet; $('cOk').onclick = () => importPl(url);
    return;
  }
  if (!$('scrim').classList.contains('on')) return;
  if (!j.songs.length) { closeSheet(); return toast('Esa playlist no tiene canciones'); }
  const saved = j.songs.filter(s => s.where === 'guardada').length;
  sheet(`<h4>${esc(j.name)}</h4><p class="sub" style="margin:4px 12px 14px">${nSongs(j.songs.length)} · ✓ ${saved} ya estaban · ☁ ${j.songs.length - saved} de internet
      ${j.truncated ? `<br>Tiene ${j.total}: solo se importan las primeras ${j.songs.length}.` : ''}${saved < j.songs.length ? '<br>Las de internet se guardan en el servidor la primera vez que suenan.' : ''}</p>
    <div class="btns"><button class="pill glass" id="cNo">Descartar</button><button class="pill main" id="cOk">Guardar playlist</button></div>`);
  $('cNo').onclick = closeSheet;
  $('cOk').onclick = async () => {
    closeSheet();
    let p;
    try {
      p = await newPl(j.name.slice(0, 100));
      p.songs = j.songs; await savePl(p);
    } catch (e) {
      if (p) p.songs = [];
      return toast(p ? 'Se creó la playlist, pero no se pudieron guardar las canciones' : 'No se pudo crear la playlist');
    }
    toast('Playlist importada'); showPlaylist(p);
  };
}

function albumsOf(songs, n = 12) {
  const seen = new Set(), out = [];
  for (const s of songs) {
    if (!s.album) continue; const k = norm(s.album + '|' + s.artist); if (seen.has(k)) continue;
    seen.add(k); out.push({name: s.album, artist: s.artist || '', thumb: s.thumb}); if (out.length === n) break;
  }
  return out;
}

// Rendimiento: lo que gasta datos o batería se puede apagar (se recuerda en este navegador). Apagado, el Canvas no
// pregunta ni baja nada; "varios dispositivos" deja de esperar al servidor (ni se ve desde otros ni los maneja);
// sin animaciones, la portada viva, el fondo y el ecualizador se quedan quietos.
const REND = [['canvas', '🎬 Canvas', 'El vídeo de fondo en el reproductor grande (~0,5 MB por canción)'],

function ponRend(n) {
  const antes = rend; rend = n; store.set('rendimiento', rend);
  document.documentElement.classList.toggle('quieto', !rend.animaciones);
  if (antes.canvas !== rend.canvas) { if (rend.canvas) canvasEstado(cur); else pintaCanvas(); }
  if (antes.conectar !== rend.conectar) cxEncender(rend.conectar);
}

      `<button class="${k === ac ? 'on' : ''}" data-ac="${k}" title="${n}" aria-label="${n}" style="background:${hex};color:${luminancia(hex) > .45 ? '#000' : '#fff'}">${k === ac ? '✓' : ''}</button>`).join('')}</div>
    <div class="ajuste">RENDIMIENTO · SOLO EN ESTE DISPOSITIVO</div>${REND.map(([k, t, d]) =>
      `<div class="rend"><div>${t}<small>${d}</small></div><button class="switch${rend[k] ? ' on' : ''}" data-rend="${k}" aria-label="${t}"></button></div>`).join('')}

  $('ajAhorro').onclick = () => { const on = !REND.some(([k]) => rend[k]); ponRend(Object.fromEntries(REND.map(([k]) => [k, on]))); ajustes(); };

  $('sheet').querySelectorAll('[data-ac]').forEach(b => b.onclick = () => { acentos[tema] = b.dataset.ac; store.set('acentos', acentos); aplicarTema(); ajustes(); });
}

async function buscar() {
  lists = {};
  if (!genresCache) genresCache = (await api('/genres').catch(() => ({genres: []}))).genres;
  wrap.innerHTML = `<div class="search"><label class="field">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="color:var(--texto2)" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Canciones, artistas o álbumes…" autocomplete="off"></label>
    <div class="sugg" id="sugg" hidden></div>
    <div id="filters">${genresCache.length ? `<div class="chips una" id="genres">${genresCache.map(g =>
        `<button class="chip glass genre" data-g="${esc(g.name)}">${esc(g.name)}</button>`).join('')}</div>` : ''}
    <div class="chips orden" id="chips"><span class="chips-et">Ordenar</span><button class="chip glass" data-v="recientes">Recientes</button><button class="chip glass" data-v="populares">Populares</button>
      <button class="chip glass" data-v="nombre">A–Z</button><button class="chip glass" data-v="artista">Por artista</button></div></div></div>
    <div id="res" class="fade"></div>`;
  // Escribir solo abre el cuadro de sugerencias; los resultados salen con Enter o al elegir "Buscar «…»".
  $('q').addEventListener('input', () => { clearTimeout(suggTimer); suggTimer = setTimeout(sugerir, 120);
    if (!$('q').value.trim()) { $('sugg').hidden = true; showAll(); } });
  $('q').addEventListener('focus', () => { if ($('q').value.trim() && suggs.length) $('sugg').hidden = false; });
  $('q').addEventListener('blur', () => setTimeout(() => $('sugg') && ($('sugg').hidden = true), 180));
  $('sugg').onmousedown = e => e.preventDefault();   // que el clic no cierre el cuadro antes de tiempo
  $('sugg').onclick = e => { const b = e.target.closest('[data-s]'); if (b) elegirSug(+b.dataset.s); };
  $('q').addEventListener('keydown', e => {
    const n = $('sugg').hidden ? 0 : suggSel.length;
    if (e.key === 'ArrowDown' && n) { e.preventDefault(); suggIdx = (suggIdx + 1) % n; pintaSel(); }
    else if (e.key === 'ArrowUp' && n) { e.preventDefault(); suggIdx = (suggIdx - 1 + n) % n; pintaSel(); }
    else if (e.key === 'Escape') { $('sugg').hidden = true; }
    else if (e.key === 'Enter') { e.preventDefault(); elegirSug(suggIdx >= 0 && n ? suggIdx : 0); }
  });
  $('chips').onclick = e => { const c = e.target.closest('.chip'); if (c) { libSort = c.dataset.v; showAll(); } };
  if ($('genres')) $('genres').onclick = e => { const c = e.target.closest('.chip'); if (c) { libGenre = libGenre === c.dataset.g ? null : c.dataset.g; showAll(); } };
  showAll();
}
// Toda la biblioteca (o un género) con scroll infinito. Tocar una canción = suelta (radio con recomendadas).
async function showAll() {

}
async function morePage() {
  if (!page || loading || page.offset >= page.total || !$('lst')) return;
  loading = true;
  try {
    const p = page, j = await api(`/library?sort=${p.sort}&offset=${p.offset}&limit=60${p.genre ? '&genre=' + encodeURIComponent(p.genre) : ''}`);
    if (page !== p) return;
    const arr = lists[p.key].songs, from = arr.length;
    arr.push(...j.songs);
    const tmp = setList('_tmp', j.songs, 'radio');
    $('lst').insertAdjacentHTML('beforeend', rows(tmp).replace(new RegExp(`data-l="${tmp}" data-i="(\\d+)"`, 'g'), (_, i) => `data-l="${p.key}" data-i="${from + +i}"`));
    p.offset += j.songs.length; p.total = j.total;
    $('more').textContent = p.offset >= p.total ? (p.genre ? `${nSongs(p.total)} de ${p.genre}` : `${nSongs(p.total)} en el servidor`) : 'Cargando…';

}

// Búsqueda en lo guardado, por secciones: artistas, canciones (5 y "Ver todas") y álbumes.
// Sugerencias mientras se escribe (/suggest: de lo guardado, sin YouTube), en un cuadro flotante. La primera
// opción siempre es "Buscar «…»" (lo mismo que Enter); flechas para moverse.
let suggTimer, suggs = [], suggSel = [], suggIdx = -1;
async function sugerir() {
  const q = $('q') ? $('q').value.trim() : '';
  if (!q) { $('sugg').hidden = true; return; }
  let j = {sugerencias: []};
  try { j = await api('/suggest?q=' + encodeURIComponent(q)); } catch (e) {}
  if (!$('q') || $('q').value.trim() !== q || document.activeElement !== $('q')) return;
  suggs = j.sugerencias;
  suggSel = [{tipo: 'buscar', texto: q}, ...suggs]; suggIdx = -1;
  const tipo = {artista: 'Artista', album: 'Álbum', cancion: 'Canción'};
  $('sugg').innerHTML = suggSel.map((s, i) => s.tipo === 'buscar'
    ? `<button data-s="${i}"><span class="ic">🔎</span><span class="tx"><b>Buscar «${esc(q)}»</b><small>Ver todos los resultados</small></span></button>`
    : `<button class="${s.tipo}" data-s="${i}">${s.thumb ? `<img src="${esc(s.thumb)}" alt="" loading="lazy">` : '<span class="ic">🎵</span>'}
       <span class="tx"><b>${esc(s.texto)}</b><small>${tipo[s.tipo]}${s.tipo === 'artista' ? (s.canciones ? ` · ${s.canciones} canciones` : '')
       : s.artista ? ` · ${esc(s.artista)}` : ''}</small></span></button>`).join('');
  $('sugg').hidden = false;
}
function pintaSel() { $('sugg').querySelectorAll('[data-s]').forEach(b => b.classList.toggle('sel', +b.dataset.s === suggIdx)); }
function elegirSug(i) {
  const s = suggSel[i] || {tipo: 'buscar'}; $('sugg').hidden = true; $('q').blur();
  if (s.tipo === 'artista') return showArtist(s.texto);
  if (s.tipo === 'album') return showAlbum(s.artista || '', s.texto);
  if (s.tipo === 'cancion') { listCtx = 'busqueda'; return playOne({id: s.id, title: s.texto, artist: s.artista, thumb: s.thumb, where: 'guardada'}); }
  search();   // "Buscar «…»" o Enter: los resultados completos
}

async function search() {
  const q = $('q').value.trim();
  if (!q) return showAll();
  lastQ = q; page = null; $('filters').style.display = 'none';
  if (!artistsCache) artistsCache = (await api('/artists')).artists;
  const j = await api('/search?yt=0&q=' + encodeURIComponent(q));   // solo lo guardado: no toca YouTube
  if (q !== lastQ) return;
  resTotal = j.total || j.results.length;
  // los artistas los decide el servidor (tolera faltas: "cancerbero" -> Canserbero); si no los manda, los de antes
  const nq = norm(q), words = nq.split(/\s+/).filter(Boolean);
  const arts = j.artists || artistsCache.filter(a => { const n = norm(a.name), aw = n.split(/[\s\-_.,&]+/);
    return n.includes(nq) || words.every(w => aw.some(x => x.startsWith(w))); })
    .sort((a, b) => (norm(a.name).startsWith(nq) ? 0 : 1) - (norm(b.name).startsWith(nq) ? 0 : 1)).slice(0, 10);
  setList('res', j.results, 'radio');
  renderResults(arts, false);
}
let resTotal = 0;
async function renderResults(arts, all) {
  if (all && lists.res.songs.length < resTotal) {   // "Ver todas": traer las que faltan (hasta 200)
    const q = lastQ, j = await api(`/search?yt=0&limit=200&q=${encodeURIComponent(q)}`);
    if (q !== lastQ) return;
    setList('res', j.results, 'radio');
  }
  const songs = lists.res.songs, albs = albumsOf(songs);
  setList('res5', all ? songs : songs.slice(0, 5), 'radio');

  if (arts.length) h += `<h2>Artistas</h2><div class="rail">${artistCards(arts)}</div>`;
  if (songs.length) h += `<h2>Canciones${Math.max(resTotal, songs.length) > 5 ? `<button class="link" id="allSongs">${all ? 'Ver menos' : `Ver todas (${Math.max(resTotal, songs.length)})`}</button>` : ''}</h2><div class="list">${rows('res5')}</div>`;
  if (albs.length) h += `<h2>Álbumes</h2><div class="rail">${albumCards(albs)}</div>`;
  if (!h) h = '<div class="empty">No hay nada guardado con eso.</div>';
  $('res').innerHTML = h + `<button class="yt glass">🔎 Buscar «${esc(lastQ)}» en internet</button>`;
  if ($('allSongs')) $('allSongs').onclick = () => renderResults(arts, !all);
}

// Cada fila horizontal recibe sus flechas ‹ ›; solo se ven si hay más hacia ese lado.
const ARROW = d => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="${d}"/></svg>`;
function railArrows() {
  wrap.querySelectorAll('.rail:not([data-arrows])').forEach(rail => {
    rail.dataset.arrows = '1';
    const box = document.createElement('div'); box.className = 'rail-box';
    rail.replaceWith(box); box.appendChild(rail);
    const mk = (cls, d, dir) => { const b = document.createElement('button'); b.className = 'rail-arrow ' + cls; b.innerHTML = ARROW(d);
      b.setAttribute('aria-label', dir < 0 ? 'Anteriores' : 'Siguientes');
      b.onclick = e => { e.stopPropagation(); rail.scrollBy({left: dir * rail.clientWidth * 0.85, behavior: 'smooth'}); }; box.appendChild(b); return b; };
    const l = mk('l', 'M15 5l-7 7 7 7', -1), r = mk('r', 'M9 5l7 7-7 7', 1);
    const upd = () => { l.classList.toggle('on', rail.scrollLeft > 4); r.classList.toggle('on', rail.scrollLeft + rail.clientWidth < rail.scrollWidth - 4); };
    rail.addEventListener('scroll', upd, {passive: true}); addEventListener('resize', upd); upd();
  });
}
new MutationObserver(railArrows).observe(wrap, {childList: true, subtree: true});

function go(t) {

    const ya = [...exclude].filter(i => /^[\w-]{11}$/.test(i)).slice(-300).join(',');
    const r = (await api(`/radio?desde=cancion:${encodeURIComponent(seed.id)}&ya=${ya}&n=10`)).songs.filter(s => !exclude.has(s.id));
    if (r.length) return r.map(s => ({...s, _rec: true}));

  const recentArtists = [];

  if (!/^[\w-]{11}$/.test(s.id)) e = {estado: 'no', motivo: 'no viene de YouTube'};

  if (e.estado === 'haciendo' && intento < 8) canvasTimer = setTimeout(() => cur?.id === s.id && canvasEstado(s, intento + 1), 20000);

// Iconito en la esquina de la portada cuando no se ve el Canvas, para saber por qué (al tocarlo lo dice): tachado = no
// tiene (para siempre), latiendo = se está haciendo, reloj = en espera, aviso = error. Con Canvas no sale.
const CV_FILM = '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 4v16M17 4v16M3 9h4M3 15h4M17 9h4M17 15h4"/>';
const CV_ICO = {no: CV_FILM + '<path d="M2 2l20 20" stroke-width="2.4"/>', haciendo: CV_FILM,
  espera: '<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>', error: '<path d="M12 3 2 20h20L12 3z"/><path d="M12 10v4M12 17h.01"/>'};
function pintaBadge() {
  const b = $('npCvB'), e = cvDe(cur), k = e.estado === 'haciendo' && e.espera ? 'espera' : e.estado;
  b.hidden = !CV_ICO[k] || sinMovimiento.matches || !rend.canvas;

  b.title = {no: 'Sin Canvas: ' + e.motivo, haciendo: 'Preparando el Canvas…', espera: 'Canvas en espera: ' + e.espera,

$('npCvB').onclick = e => { e.stopPropagation(); toast($('npCvB').title); };

      const r = await fetch('/canvas/' + encodeURIComponent(s.id), {headers: {Authorization: 'Bearer ' + session}});

panelFijo.addEventListener('change', () => pintaCanvas());
// Con Canvas, la escena (vídeo, títulos y controles) llena el alto: en el móvil la pantalla entera (la cola y la letra,
// al bajar); en el PC, solo el hueco que quede (con la letra oculta o sin letra no queda espacio vacío debajo).
let escenaRaf = 0;
function ajustaEscena() {
  cancelAnimationFrame(escenaRaf);
  escenaRaf = requestAnimationFrame(() => {
    const np = $('np'), inn = np.querySelector('.in'), cover = np.querySelector('.cover'), tabs = $('npTabs');
    cover.style.height = '';
    if (!np.classList.contains('con-canvas')) return np.style.removeProperty('--escena');
    // la barra Siguiente | Letra va pegada arriba al bajar (sticky) y Chrome da su posición PEGADA: medida así (al
    // cambiar de canción leyendo la letra) el Canvas bajaba hasta media letra (vídeo de Ramses, 07-11-2026). Se mide
    // en su sitio normal, sin pegar, y se devuelve.
    if (panelFijo.matches) {   // PC (barra limpia): el Canvas llena el reproductor; con Letra/Cola, la mitad de arriba
      return np.style.setProperty('--escena', (npAbierto ? cover.offsetTop + cover.offsetHeight : inn.clientHeight) + 'px');

function mideEscena(np, inn, cover, tabs) {

    const falta = panelFijo.matches ? 0 : np.clientHeight - (tabs.offsetTop + tabs.offsetHeight + pad);
    if (falta > 0) {
      cover.style.height = cover.offsetHeight + falta + 'px';
      const sobra = panelFijo.matches ? inn.scrollHeight - inn.clientHeight : 0;   // márgenes que no se ven en la cuenta
      if (sobra > 0) cover.style.height = cover.offsetHeight - sobra + 'px';

addEventListener('resize', () => ajustaEscena());   // otra anchura o altura: otra medida (antes se quedaba la vieja)
new MutationObserver(ajustaEscena).observe($('npPanel'), {childList: true, subtree: true});
addEventListener('resize', ajustaEscena);

function paintNp() {
  $('np').classList.toggle('sin', !cur);   // sin canción: el panel de la derecha enseña un mensaje en vez de quedar vacío
  if (tresColumnas.matches) { if (npTab === 'cola') npTab = 'letra'; paintQueue(); }
  if (!cur) return;
  $('npImg').src = cur.thumb || ''; $('npTint').style.backgroundImage = cur.thumb ? `url("${cur.thumb.replace(/"/g, '%22')}")` : 'none';
  $('npT').textContent = cur.title; $('npA').textContent = cur.artist || '';
  $('npAl').hidden = !cur.album || cur.where === 'youtube'; $('npAlT').textContent = cur.album || '';
  $('npShuffle').innerHTML = isRadio ? ICO.radio : ICO.shuffle;
  $('npShuffle').classList.toggle('on', isRadio || shuffleNow());
  $('npShuffle').title = isRadio ? 'Radio: las siguientes son recomendadas' : 'Aleatorio';
  $('npRepeat').innerHTML = repeat === 'one' ? ICO.repeatOne : ICO.repeat;
  $('npRepeat').classList.toggle('on', repeat !== 'off');
  $('npRepeat').title = {off: 'Repetir', all: 'Repitiendo la lista', one: 'Repitiendo esta canción'}[repeat];
  document.querySelectorAll('#npTabs button').forEach(b => b.classList.toggle('on', b.dataset.np === npTab && (!tresColumnas.matches || letraOn) && (!panelFijo.matches || npAbierto)));
  const letraBtn = document.querySelector('#npTabs [data-np="letra"]');
  letraBtn.textContent = tresColumnas.matches ? (letraOn ? 'Letra · ocultar' : 'Mostrar letra') : 'Letra';
  if (tresColumnas.matches && !letraOn) { $('npPanel').innerHTML = ''; lyrFor = null; lyrLines = []; paintHearts(); return; }
  paintHearts();
  if (npTab === 'cola') paintQueue(); else loadLyrics();
}
// La cola conserva sus filas e índices: solo se reconstruye cuando cambia (qVer).
// Se muestran como máximo las dos anteriores en gris, la actual y todas las siguientes.
// Las anteriores ocultas siguen disponibles con Anterior, sin cambiar el orden de reproducción.
let qVer = 0, qPainted = null, qKeepScroll = false;
const scrollBox = el => { for (let p = el.parentElement; p; p = p.parentElement) {
  const o = getComputedStyle(p).overflowY; if ((o === 'auto' || o === 'scroll') && p.scrollHeight > p.clientHeight) return p; } return null; };
function paintQueue() {
  pintaAhoraSig();
  // ≥1500 px: la cola vive en su barra de la izquierda, siempre a la vista; con Ahora abierta, en su panel Cola
  const enBarra = tresColumnas.matches || ($('ahv') && ahvVista === 'cola');
  if (!enBarra && (!npVisible() || npTab !== 'cola')) { qPainted = null; return; }
  const dest = enBarra ? $('qList') : $('npPanel');
  if (enBarra && !cur) { dest.innerHTML = '<div class="empty">Cuando suene algo, aquí verás lo que viene después.</div>'; qPainted = null; return; }
  const key = `${enBarra}|${qVer}|${isRadio}|${follow}`;
  if (qPainted !== key || !dest.querySelector('[data-q]')) {
    qPainted = key;
    setList('queue', queue, 'lista');
    const top = isRadio
      ? `<div class="radio"><span>📻</span><div>Radio de «${esc(queue[0]?.title)}»<small>Detrás van canciones recomendadas; se añaden más solas</small></div></div>`
      : `<div class="radio"><span>📻</span><div>Seguir con canciones parecidas<small>Al acabarse la lista</small></div><button class="switch${follow ? ' on' : ''}" id="npFollow" aria-label="Seguir con parecidas"></button></div>`;
    dest.innerHTML = top + `<div class="list">${queue.map((s, i) =>
      `<div class="row" data-qrow="${i}"><button class="hit" data-q="${i}">${s.thumb ? `<img src="${esc(s.thumb)}" loading="lazy" alt="">` : '<span class="ph"></span>'}
      <span class="meta"><div class="t">${esc(s.title)}</div><div class="a">${s._cola ? '<span class="tag">Añadida</span> ' : ''}${esc(s.artist || '')}</div></span><span class="d">${dur(s.duration)}</span></button><span class="grip" aria-label="Arrastrar para mover">≡</span></div>`).join('')}</div>`;
    if ($('npFollow')) $('npFollow').onclick = () => { follow = !follow; store.set('seguir_parecidas', follow); paintQueue(); };
    markQueue(dest, !qKeepScroll); qKeepScroll = false;
  } else markQueue(dest, false);
}
function markQueue(dest, fresh) {
  dest.querySelectorAll('[data-qrow]').forEach(r => { const i = +r.dataset.qrow;
    r.hidden = i < qi - 2;
    r.classList.toggle('playing', i === qi); r.classList.toggle('past', i < qi); });
  const row = dest.querySelector(`[data-qrow="${qi}"]`), box = row && scrollBox(row);
  if (!box) return;
  // la cola del reproductor grande va debajo de la portada (o del Canvas): no bajar si se está mirando la portada
  // (solo si se desplaza el reproductor entero, el móvil; en el PC la cola tiene su panel y baja dentro de él)
  if ((box === $('np') || box.classList.contains('in')) && box.scrollTop < $('npTabs').offsetTop - 40) return;
  const b = box.getBoundingClientRect(), rr = row.getBoundingClientRect();
  if (fresh) {   // recién pintada: hasta 2 anteriores encima de la que suena
    const first = dest.querySelector(`[data-qrow="${Math.max(0, qi - 2)}"]`);
    box.scrollTop += first.getBoundingClientRect().top - b.top - 8;

// Mover una canción de la cola arrastrándola (mantener pulsado; en el móvil, ~0,35 s quieto y vibra). Solo las que

let qDrag = null, qNoClick = false;

for (const box of [$('qList'), $('npPanel')]) {
  box.addEventListener('pointerdown', qDown);
  box.addEventListener('dragstart', e => e.preventDefault());   // que el navegador no arrastre la portada
  box.addEventListener('contextmenu', e => { if (e.target.closest('[data-qrow]')) e.preventDefault(); });   // pulsación larga
  box.addEventListener('click', e => { if (qNoClick) { e.stopPropagation(); e.preventDefault(); } }, true);
}

addEventListener('pointerup', qUp); addEventListener('pointercancel', qUp);
addEventListener('touchmove', e => { if (qDrag?.on) e.preventDefault(); }, {passive: false});   // arrastrando: sin scroll de la página
$('qList').addEventListener('click', e => npPanelClick(e));
$('npPanel').addEventListener('click', e => npPanelClick(e));
function npPanelClick(e) {
  const q = e.target.closest('[data-q]'); if (q) { qi = +q.dataset.q; start(); }
  const l = e.target.closest('[data-at]'); if (l) irA(+l.dataset.at);
}

// ---------- letras ----------
// Del servidor (/lyrics) si las tiene; si no, de lrclib.net (gratis, sin clave), limpiando el título de YouTube.
const lyricsMemo = {}; let lyrLines = [], lyrFor = null, lyrNow = -1;
function cleanTitle(s) {
  let title = s.title || '', artist = s.artist || '';
  const m = title.match(/\s[-–—]\s/);
  if (m) { const left = title.slice(0, m.index).trim(), right = title.slice(m.index + m[0].length).trim();
    if (!artist || norm(left).includes(norm(artist).split(' ')[0])) { if (!artist) artist = left; title = right; } }
  title = title.replace(/\s*[\(\[][^\)\]]*[\)\]]/g, '').replace(/\s*(ft\.?|feat\.?)\s.*$/i, '').replace(/\|.*$/, '').trim();
  return {artist: artist.trim(), track: title || s.title};
}
async function fetchLyrics(s) {
  if (s.id in lyricsMemo) return lyricsMemo[s.id];
  let out = null;
  try { const j = await api('/lyrics/' + encodeURIComponent(s.id)); if (j.synced || j.plain) out = {synced: j.synced, plain: j.plain}; } catch (e) {}
  if (!out) {
    const c = cleanTitle(s), pick = j => (j && (j.syncedLyrics || j.plainLyrics)) ? {synced: j.syncedLyrics, plain: j.plainLyrics} : null;
    try {
      if (c.artist) { const r = await fetch('https://lrclib.net/api/get?' + new URLSearchParams({artist_name: c.artist, track_name: c.track, ...(s.duration ? {duration: s.duration} : {})}));
        if (r.ok) out = pick(await r.json()); }
      if (!out) { const r = await fetch('https://lrclib.net/api/search?' + new URLSearchParams({q: `${c.artist} ${c.track}`.trim()}));
        if (r.ok) { let l = await r.json(); if (s.duration) l = l.filter(x => x.duration && Math.abs(x.duration - s.duration) <= 5);
          l.sort((a, b) => (b.syncedLyrics ? 1 : 0) - (a.syncedLyrics ? 1 : 0)); for (const x of l) { out = pick(x); if (out) break; } } }
    } catch (e) {}
  }
  return lyricsMemo[s.id] = out;
}
async function loadLyrics() {
  const s = cur; if (!s) return;
  if (lyrFor === s.id && $('npPanel').querySelector('.lyr')) return;
  lyrFor = s.id; lyrLines = []; lyrNow = -1;
  $('npPanel').innerHTML = '<div class="empty">Buscando la letra…</div>';
  const l = await fetchLyrics(s);
  if (lyrFor !== s.id || npTab !== 'letra') return;
  if (!l) { $('npPanel').innerHTML = '<div class="empty">No hay letra para esta canción</div>'; return; }
  if (l.synced) {
    for (const raw of l.synced.split('\n')) { const tags = [...raw.matchAll(/\[(\d+):(\d+(?:\.\d+)?)\]/g)]; if (!tags.length) continue;
      const text = raw.slice(tags[tags.length - 1].index + tags[tags.length - 1][0].length).trim();
      for (const t of tags) lyrLines.push({at: +t[1] * 60 + +t[2], text}); }
    lyrLines.sort((a, b) => a.at - b.at);
    $('npPanel').innerHTML = `<div class="lyr">${lyrLines.map((x, i) => `<p data-at="${x.at}" data-li="${i}">${esc(x.text) || '♪'}</p>`).join('')}</div>`;
    followLyrics();
  } else $('npPanel').innerHTML = `<div class="lyr plain"><p>${esc(l.plain)}</p></div>`;
}
function followLyrics() {
  if (!lyrLines.length || npTab !== 'letra' || !npVisible()) return;
  const t = tiempo(); let i = -1; for (let k = 0; k < lyrLines.length && lyrLines[k].at <= t; k++) i = k;
  if (i === lyrNow) return; lyrNow = i;
  $('npPanel').querySelectorAll('.lyr p').forEach((p, k) => { p.classList.toggle('now', k === i); p.classList.toggle('past', k < i); });
  const el = $('npPanel').querySelector(`[data-li="${i}"]`); if (!el) return;
  if (panelFijo.matches) {   // en el PC, solo dentro del panel de la letra (scrollIntoView movía también el reproductor y el Canvas)
    const box = $('npPanel'), b = box.getBoundingClientRect(), r = el.getBoundingClientRect();
    box.scrollTo({top: box.scrollTop + r.top - b.top - box.clientHeight / 2 + r.height / 2, behavior: 'smooth'});
  } else el.scrollIntoView({block: 'center', behavior: 'smooth'});
}
