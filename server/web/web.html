<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080A12">
<title>Música</title>
<link rel="icon" href="/logo-96.webp" type="image/webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  /* La app en el navegador (mismo tema que la app Flutter). Ver README, "Repartir la app y versión web". */
  :root {
    --bg: #080A12; --card: #151725; --raised: #202033;
    --primary: #9B5CFF; --secondary: #F04DBB; --blue: #5268FF;
    --text: #FFFFFF; --muted: #A3A5B5;
    --glass: rgba(21, 23, 37, .45); --glass-hi: rgba(32, 32, 51, .55); --line: rgba(255, 255, 255, .07);
    --radius: 14px; --gutter: 20px; --ease: cubic-bezier(.2, .7, .2, 1);
    --nav-h: 64px;
  }
  * { box-sizing: border-box; margin: 0; }
  html { background: var(--bg); color: var(--text); }
  body { background: transparent; color: var(--text); }   /* sin fondo: si no, tapa la capa de color (.bg) */
  body { font-family: Inter, Roboto, system-ui, sans-serif; -webkit-font-smoothing: antialiased; min-height: 100vh; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  img { display: block; }
  .glass { background: var(--glass); border: 1px solid var(--line); backdrop-filter: blur(18px) saturate(140%);
           -webkit-backdrop-filter: blur(18px) saturate(140%); }

  /* Fondo: manchas de color quietas detrás del cristal */
  .bg { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
  .bg i { position: absolute; border-radius: 50%; }
  .bg i:nth-child(1) { width: 70vmax; height: 70vmax; left: -25vmax; top: -30vmax; background: radial-gradient(closest-side, rgba(155,92,255,.42), transparent); }
  .bg i:nth-child(2) { width: 55vmax; height: 55vmax; right: -20vmax; top: 15vh; background: radial-gradient(closest-side, rgba(240,77,187,.26), transparent); }
  .bg i:nth-child(3) { width: 60vmax; height: 60vmax; left: 5vw; bottom: -32vmax; background: radial-gradient(closest-side, rgba(82,104,255,.26), transparent); }
  /* La portada de lo que suena, muy desenfocada, tiñe el fondo (y el cristal deja verla) */
  .bg b { position: absolute; inset: -10%; background-size: cover; background-position: center; filter: blur(70px) saturate(160%);
          opacity: 0; transition: opacity 600ms ease, background-image 600ms ease; }
  .bg b.on { opacity: .55; }
  .bg::after { content: ""; position: absolute; inset: 0; background: linear-gradient(rgba(8,10,18,.1), rgba(8,10,18,.45) 55%, rgba(8,10,18,.8)); }

  .wrap { max-width: 920px; margin: 0 auto; padding: 0 var(--gutter) calc(var(--nav-h) + 110px); }
  header { display: flex; align-items: center; gap: 14px; padding: 24px 0 6px; }
  header .hi { flex: 1; min-width: 0; }
  header h1 { font-size: 1.6rem; font-weight: 800; letter-spacing: -.3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header h1 span { color: var(--primary); }
  header p { color: var(--muted); margin-top: 4px; font-size: .95rem; }
  .avatar { width: 42px; height: 42px; border-radius: 50%; background: var(--raised); object-fit: cover; border: 1px solid var(--line);
            display: grid; place-items: center; font-weight: 800; }
  span.avatar { background: linear-gradient(135deg, var(--primary), var(--secondary)); }
  .menu { position: relative; }
  .menu-list { position: absolute; right: 0; top: 50px; z-index: 30; min-width: 240px; padding: 6px; border-radius: var(--radius);
    background: var(--glass-hi); box-shadow: 0 16px 40px rgba(0,0,0,.45);
    opacity: 0; transform: translateY(-6px); pointer-events: none; transition: 200ms var(--ease); }
  .menu-list.on { opacity: 1; transform: none; pointer-events: auto; }
  .menu-list button { display: flex; gap: 10px; align-items: center; width: 100%; padding: 11px 12px; border-radius: 10px; text-align: left; font-size: .95rem; }
  .menu-list button:hover { background: rgba(255,255,255,.06); }
  .menu-list small { color: var(--muted); display: block; font-size: .78rem; }

  .apk { display: none; margin: 14px 0 4px; padding: 14px 16px; border-radius: var(--radius); align-items: center; gap: 12px;
         background: linear-gradient(120deg, rgba(155,92,255,.24), rgba(240,77,187,.12)); }
  .apk.on { display: flex; }
  .apk div { flex: 1; font-size: .9rem; line-height: 1.4; } .apk div b { display: block; font-size: .98rem; }
  .apk .go { background: var(--primary); padding: 9px 14px; border-radius: 999px; font-weight: 600; font-size: .88rem; }
  .apk .x { color: var(--muted); padding: 4px 6px; }

  h2 { font-size: 1.12rem; font-weight: 700; margin: 24px 0 12px; display: flex; align-items: center; gap: 10px; }
  h2 small { margin-left: auto; color: var(--muted); font-weight: 400; font-size: .85rem; }
  .back { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; flex: none; }
  .sub { color: var(--muted); font-size: .88rem; margin: -6px 0 14px; }
  .title-big { font-size: 1.6rem; font-weight: 800; margin-top: 22px; }

  /* Carruseles horizontales (Inicio) */
  .rail { display: flex; gap: 14px; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 4px; scrollbar-width: none; }
  .rail::-webkit-scrollbar { display: none; }
  .rail > * { scroll-snap-align: start; flex: none; width: 150px; }
  .card { text-align: left; border-radius: var(--radius); overflow: hidden; transition: transform 200ms var(--ease), background 200ms; }
  .card:hover { transform: translateY(-2px); background: var(--glass-hi); }
  .card img { width: 100%; aspect-ratio: 1; object-fit: cover; background: var(--raised); }
  .card.round img { border-radius: 50%; width: calc(100% - 24px); margin: 12px auto 0; }
  .card div { padding: 10px 12px 12px; }
  .card b { display: block; font-size: .92rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card small { color: var(--muted); font-size: .8rem; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }

  .search { position: sticky; top: 0; z-index: 20; padding: 18px var(--gutter) 10px; margin: 0 calc(-1 * var(--gutter));
            background: rgba(8,10,18,.35); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); }
  .field { display: flex; align-items: center; gap: 10px; height: 50px; padding: 0 16px; border-radius: 999px; transition: border-color 200ms; }
  .field:focus-within { border-color: rgba(155,92,255,.6); }
  .field input { flex: 1; min-width: 0; height: 100%; background: none; border: 0; outline: 0; color: var(--text); font: inherit; }
  .field input::placeholder { color: var(--muted); }
  .chips { display: flex; gap: 8px; margin-top: 12px; overflow-x: auto; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; padding: 8px 16px; border-radius: 999px; color: var(--muted); font-size: .9rem; transition: background 200ms, color 200ms; }
  .chip.on { background: var(--primary); color: var(--text); font-weight: 600; border-color: transparent; }

  .list { display: flex; flex-direction: column; gap: 2px; }
  .row { display: flex; align-items: center; gap: 12px; padding: 8px; border-radius: 12px; width: 100%; transition: background 200ms; }
  .row:hover { background: rgba(255,255,255,.045); }
  .row.playing .t { color: var(--primary); }
  .row .hit { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; text-align: left; }
  .row img, .row .ph { width: 48px; height: 48px; border-radius: 10px; object-fit: cover; background: var(--raised); flex: none; }
  .row .meta { flex: 1; min-width: 0; }
  .row .t { font-size: .97rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .a { color: var(--muted); font-size: .84rem; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .d { color: var(--muted); font-size: .82rem; flex: none; }
  .tag { display: inline-block; font-size: .7rem; padding: 1px 6px; border-radius: 6px; margin-right: 6px; vertical-align: 1px; background: rgba(82,104,255,.2); color: #c3caff; }
  .heart { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; flex: none; color: var(--muted); transition: color 200ms, transform 200ms; }
  .heart svg { width: 20px; height: 20px; }
  .heart.on { color: var(--secondary); }
  .heart:active { transform: scale(.85); }
  .empty, .more { color: var(--muted); text-align: center; padding: 26px 0; font-size: .92rem; line-height: 1.5; }
  .yt { display: block; margin: 16px auto 0; padding: 11px 18px; border-radius: 999px; font-weight: 600; font-size: .92rem; }

  /* Minirreproductor y barra de pestañas, fijos abajo, de cristal */
  .dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; padding: 0 12px calc(10px + env(safe-area-inset-bottom)); pointer-events: none; }
  .dock > * { max-width: 896px; margin: 0 auto; pointer-events: auto; }
  .bar { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 16px; background: var(--glass-hi);
         box-shadow: 0 -6px 40px rgba(0,0,0,.4); position: relative; overflow: hidden;
         max-height: 0; opacity: 0; padding-top: 0; padding-bottom: 0; margin-bottom: 0; border-width: 0;
         transition: max-height 300ms var(--ease), opacity 300ms, padding 300ms, margin 300ms; }
  .bar.on { max-height: 90px; opacity: 1; padding-top: 9px; padding-bottom: 9px; margin-bottom: 8px; border-width: 1px; }
  .bar img { width: 46px; height: 46px; border-radius: 10px; object-fit: cover; background: var(--raised); }
  .bar .meta { flex: 1; min-width: 0; }
  .bar .t { font-weight: 600; font-size: .95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar .a { color: var(--muted); font-size: .82rem; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ctl { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; flex: none; }
  .ctl.main { width: 46px; height: 46px; background: var(--primary); box-shadow: 0 6px 20px rgba(155,92,255,.35); }
  .ctl svg { width: 22px; height: 22px; fill: currentColor; }
  .prog { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(255,255,255,.08); cursor: pointer; }
  .prog i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--primary), var(--secondary)); }
  .time { color: var(--muted); font-size: .76rem; flex: none; min-width: 74px; text-align: right; }
  nav { display: flex; height: var(--nav-h); border-radius: 18px; box-shadow: 0 -6px 40px rgba(0,0,0,.35); }
  nav button { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
               color: var(--muted); font-size: .74rem; position: relative; transition: color 200ms; }
  nav button svg { width: 24px; height: 24px; }
  nav button.on { color: var(--text); }
  nav button.on svg { color: var(--primary); }
  nav button.on::after { content: ""; position: absolute; bottom: 6px; width: 18px; height: 3px; border-radius: 3px; background: var(--primary); }
  @media (max-width: 560px) { .time, .ctl.side { display: none; } }

  .toast { position: fixed; left: 50%; bottom: calc(var(--nav-h) + 110px); z-index: 50; transform: translate(-50%, 20px); opacity: 0;
           padding: 10px 16px; border-radius: 12px; background: var(--glass-hi); font-size: .9rem; transition: 250ms var(--ease);
           max-width: calc(100% - 40px); text-align: center; pointer-events: none; }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }
  .fade { animation: fade 250ms var(--ease); }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } }
</style>
</head>
<body>
<div class="bg"><i></i><i></i><i></i><b id="tint"></b></div>
<div class="wrap" id="wrap"></div>

<div class="dock">
  <div class="bar glass" id="bar">
    <img id="pImg" alt="">
    <div class="meta"><div class="t" id="pT"></div><div class="a" id="pA"></div></div>
    <span class="time" id="pTime"></span>
    <button class="heart" id="pFav" aria-label="Me gusta"></button>
    <button class="ctl side" id="prev" aria-label="Anterior"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
    <button class="ctl main" id="play" aria-label="Reproducir"><svg viewBox="0 0 24 24" id="playIco"><path d="M8 5v14l11-7z"/></svg></button>
    <button class="ctl" id="next" aria-label="Siguiente"><svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
    <div class="prog" id="prog"><i id="progI"></i></div>
  </div>
  <nav class="glass" id="nav">
    <button data-tab="inicio" class="on"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3 3 10.5V21h6v-6h6v6h6V10.5z"/></svg>Inicio</button>
    <button data-tab="buscar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>Buscar</button>
    <button data-tab="biblioteca"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 4v16M10 4v16M15 5l4 15"/></svg>Biblioteca</button>
  </nav>
</div>
<div class="toast" id="toast"></div>
<audio id="audio" preload="auto"></audio>

<script>
const KEY = 'musica_sesion';
const session = (() => { try { return localStorage.getItem(KEY); } catch (e) { return null; } })();
if (!session) location.replace('/');
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const dur = s => s ? `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}` : '';
const HEART = on => `<svg viewBox="0 0 24 24" fill="${on ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2"><path d="M12 20.5s-7.5-4.6-9.3-9.2C1.4 8 3.4 4.5 7 4.5c2.1 0 3.6 1.2 5 3 1.4-1.8 2.9-3 5-3 3.6 0 5.6 3.5 4.3 6.8-1.8 4.6-9.3 9.2-9.3 9.2z"/></svg>`;
let toastT;
function toast(t) { const e = $('toast'); e.textContent = t; e.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => e.classList.remove('on'), 2600); }

async function api(path, opts = {}) {
  const r = await fetch(path, {...opts, headers: {'Content-Type': 'application/json', ...(opts.headers || {}), Authorization: 'Bearer ' + session}});
  if (r.status === 401) {   // sesión cerrada (p. ej. entró en un 4.º dispositivo): volver a entrar
    try { localStorage.removeItem(KEY); } catch (e) {}
    location.replace('/?salio=1');
    throw new Error('401');
  }
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.status);
  return r.json();
}

// ---------- estado ----------
let me = {}, favs = new Map();   // favoritas: id -> canción (sincronizadas con la app por el servidor)
let tab = 'inicio', list = [];   // list: lo que se ve ahora (la cola si se pone una de ahí)
const wrap = $('wrap');
const isAndroid = /Android/i.test(navigator.userAgent);
let apkHidden = false; try { apkHidden = localStorage.getItem('apk_oculto') === '1'; } catch (e) {}

async function loadFavs() {
  try { favs = new Map((await api('/favorites')).songs.map(s => [s.id, s])); } catch (e) { favs = new Map(); }
}
async function toggleFav(s) {
  const on = favs.has(s.id);
  on ? favs.delete(s.id) : favs.set(s.id, s);
  paintHearts();
  try {
    if (on) await api('/favorites/' + encodeURIComponent(s.id), {method: 'DELETE'});
    else await api('/favorites/' + encodeURIComponent(s.id), {method: 'PUT', body: JSON.stringify(
      {title: s.title, artist: s.artist, album: s.album, duration: s.duration, thumb: s.thumb})});
    toast(on ? 'Quitada de tus favoritas' : 'Añadida a tus favoritas');
  } catch (e) { on ? favs.set(s.id, s) : favs.delete(s.id); paintHearts(); toast('No se pudo guardar'); }
}
function paintHearts() {
  document.querySelectorAll('.heart[data-id]').forEach(h => { const on = favs.has(h.dataset.id); h.classList.toggle('on', on); h.innerHTML = HEART(on); });
  if (cur) { $('pFav').dataset.id = cur.id; const on = favs.has(cur.id); $('pFav').classList.toggle('on', on); $('pFav').innerHTML = HEART(on); }
}

// ---------- piezas ----------
function rows(songs, start = 0) {
  return songs.map((s, i) => `<div class="row${cur && cur.id === s.id ? ' playing' : ''}">
    <button class="hit" data-i="${start + i}">
      ${s.thumb ? `<img src="${esc(s.thumb)}" loading="lazy" alt="">` : '<span class="ph"></span>'}
      <span class="meta"><div class="t">${esc(s.title)}</div><div class="a">${s.where === 'youtube' ? '<span class="tag">YouTube</span>' : ''}${esc(s.artist || s.album || '')}</div></span>
      <span class="d">${dur(s.duration)}</span></button>
    <button class="heart${favs.has(s.id) ? ' on' : ''}" data-id="${esc(s.id)}" data-i="${start + i}" aria-label="Me gusta">${HEART(favs.has(s.id))}</button></div>`).join('');
}
const songCards = (songs, key) => songs.map((s, i) => `<button class="card glass" data-rail="${key}" data-i="${i}">
  <img src="${esc(s.thumb || '')}" loading="lazy" alt=""><div><b>${esc(s.title)}</b><small>${esc(s.artist || '')}</small></div></button>`).join('');
const artistCards = arts => arts.map(a => `<button class="card glass round" data-artist="${esc(a.name)}">
  <img src="${esc(a.thumb || '')}" loading="lazy" alt=""><div><b>${esc(a.name)}</b><small>${a.songs} canciones</small></div></button>`).join('');
const rails = {};   // carruseles del Inicio: clave -> canciones

function header() {
  return `<header><div class="hi"><h1>Buenas, <span>${esc(((me.name || 'tú').split(' ')[0]))}</span></h1><p>¿Qué quieres escuchar hoy?</p></div>
    <div class="menu"><button id="avatarBtn" aria-label="Menú">${me.picture ? `<img class="avatar" src="${esc(me.picture)}" alt="" referrerpolicy="no-referrer">`
      : `<span class="avatar">${esc(((me.name || '?')[0] || '?').toUpperCase())}</span>`}</button>
      <div class="menu-list glass" id="menu">
        <button id="dlBtn">⬇️ <span>Descargar app Android<small>Para tenerla instalada en el móvil</small></span></button>
        <button id="outBtn">↩️ <span>Cerrar sesión</span></button></div></div></header>
    <div class="apk glass${isAndroid && !apkHidden ? ' on' : ''}" id="apk"><div><b>¿Estás en Android?</b>Instala la app: suena con la pantalla apagada y va más fluida.</div>
      <button class="go" id="apkGo">Descargar</button><button class="x" id="apkX" aria-label="Cerrar">✕</button></div>`;
}
function wireHeader() {
  $('avatarBtn').onclick = e => { e.stopPropagation(); $('menu').classList.toggle('on'); };
  $('dlBtn').onclick = downloadApk; $('apkGo').onclick = downloadApk;
  $('apkX').onclick = () => { $('apk').classList.remove('on'); apkHidden = true; try { localStorage.setItem('apk_oculto', '1'); } catch (e) {} };
  $('outBtn').onclick = async () => {
    await api('/auth/logout', {method: 'POST'}).catch(() => {});
    try { localStorage.removeItem(KEY); } catch (e) {}
    location.replace('/');
  };
}
document.addEventListener('click', () => $('menu') && $('menu').classList.remove('on'));
async function downloadApk() {
  try { const a = await api('/app/enlace', {method: 'POST'}); location.href = a.url; toast('Bajando la app…'); }
  catch (e) { toast('La app para Android todavía no está lista'); }
}

// ---------- pestañas ----------
async function inicio() {
  wrap.innerHTML = header() + '<div id="home" class="fade"><div class="empty">Cargando…</div></div>'; wireHeader();
  const [hist, arts, pop] = await Promise.all([api('/history?limit=20').catch(() => ({songs: []})), api('/artists'),
                                               api('/library?sort=populares&limit=10')]);
  rails.hist = hist.songs; rails.favs = [...favs.values()].slice(0, 20); rails.pop = pop.songs;
  let h = '';
  if (rails.hist.length) h += `<h2>Escuchado recientemente</h2><div class="rail">${songCards(rails.hist, 'hist')}</div>`;
  if (rails.favs.length) h += `<h2>Tus favoritas <small>${favs.size}</small></h2><div class="rail">${songCards(rails.favs, 'favs')}</div>`;
  h += `<h2>Artistas</h2><div class="rail">${artistCards(arts.artists.slice(0, 20))}</div>`;
  list = rails.pop;
  h += `<h2>Lo más puesto</h2><div class="list">${rows(rails.pop)}</div>`;
  if (!rails.hist.length && !rails.favs.length) h = `<div class="empty">Pon algo y toca ♡ en lo que te guste: aquí saldrá lo tuyo,<br>igual que en la app.</div>` + h;
  $('home').innerHTML = h;
}

let mode = 'recientes', page = null, loading = false, qTimer, lastQ = '';
async function buscar() {
  wrap.innerHTML = `<div class="search"><label class="field glass">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A3A5B5" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Canciones, artistas o álbumes…" autocomplete="off"></label>
    <div class="chips" id="chips"><button class="chip glass on" data-v="recientes">Recientes</button><button class="chip glass" data-v="populares">Populares</button>
      <button class="chip glass" data-v="nombre">A–Z</button><button class="chip glass" data-v="artista">Por artista</button></div></div>
    <div id="res" class="fade"></div>`;
  $('q').addEventListener('input', () => { clearTimeout(qTimer); qTimer = setTimeout(search, 250); });
  $('chips').onclick = e => { const c = e.target.closest('.chip'); if (c) { $('q').value = ''; showAll(c.dataset.v); } };
  showAll('recientes');
}
async function showAll(sort) {
  document.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c.dataset.v === sort));
  mode = sort; list = []; page = {sort, offset: 0, total: Infinity};
  $('res').innerHTML = `<div class="list" id="lst"></div><div class="more" id="more">Cargando…</div>`;
  await morePage();
}
async function morePage() {
  if (!page || loading || page.offset >= page.total || !$('lst')) return;
  loading = true;
  try {
    const p = page, j = await api(`/library?sort=${p.sort}&offset=${p.offset}&limit=60`);
    if (page !== p) return;
    $('lst').insertAdjacentHTML('beforeend', rows(j.songs, list.length));
    list.push(...j.songs); p.offset += j.songs.length; p.total = j.total;
    $('more').textContent = p.offset >= p.total ? `${p.total} canciones en el servidor` : 'Cargando…';
  } finally { loading = false; }
}
window.addEventListener('scroll', () => { if (innerHeight + scrollY > document.body.scrollHeight - 900) morePage(); }, {passive: true});
async function search() {
  const q = $('q').value.trim();
  if (!q) return showAll('recientes');
  lastQ = q; page = null;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('on'));
  const j = await api('/search?yt=0&q=' + encodeURIComponent(q));   // solo lo guardado: no toca YouTube
  if (q !== lastQ) return;
  list = j.results;
  $('res').innerHTML = (list.length ? '<div class="list">' + rows(list) + '</div>' : '<div class="empty">No hay nada guardado con eso.</div>')
    + `<button class="yt glass">🔎 Buscar «${esc(q)}» en YouTube</button>`;
}
async function searchYouTube(b) {
  const q = lastQ; b.textContent = 'Buscando en YouTube…'; b.disabled = true;
  try {
    const j = await api('/search?yt=1&q=' + encodeURIComponent(q));
    if (q !== lastQ) return;
    list = j.results;
    $('res').innerHTML = `<div class="list fade">${rows(list)}</div>`;
  } catch (e) { b.textContent = String(e.message || e); }
}

let libTab = 'favoritas';
async function biblioteca() {
  wrap.innerHTML = `<div class="title-big">Tu biblioteca</div>
    <div class="chips" id="libChips"><button class="chip glass" data-v="favoritas">Favoritas</button><button class="chip glass" data-v="historial">Historial</button>
      <button class="chip glass" data-v="artistas">Artistas</button></div><div id="lib" class="fade"></div>`;
  $('libChips').onclick = e => { const c = e.target.closest('.chip'); if (c) { libTab = c.dataset.v; showLib(); } };
  showLib();
}
async function showLib() {
  document.querySelectorAll('#libChips .chip').forEach(c => c.classList.toggle('on', c.dataset.v === libTab));
  const box = $('lib'); box.innerHTML = '<div class="empty">Cargando…</div>';
  if (libTab === 'favoritas') {
    await loadFavs(); list = [...favs.values()];
    box.innerHTML = list.length ? `<h2>Favoritas <small>${list.length}</small></h2><div class="list">${rows(list)}</div>`
      : '<div class="empty">Toca ♡ en una canción para guardarla aquí.<br>Se ve igual en la app y en la web.</div>';
  } else if (libTab === 'historial') {
    list = (await api('/history?limit=100').catch(() => ({songs: []}))).songs;
    box.innerHTML = list.length ? `<h2>Lo último que pusiste</h2><div class="list">${rows(list)}</div>` : '<div class="empty">Todavía no has puesto nada.</div>';
  } else {
    const j = await api('/artists');
    box.innerHTML = `<h2>Artistas <small>${j.artists.length}</small></h2><div class="grid">${artistCards(j.artists.slice(0, 400))}</div>`;
  }
}

async function showArtist(name) {
  page = null;
  const a = await api('/artist?name=' + encodeURIComponent(name));
  list = a.loose;
  wrap.innerHTML = `<div class="fade"><h2><button class="back glass" data-back aria-label="Volver">←</button>${esc(a.name)}</h2>
    <p class="sub">${a.songs} canciones · ${a.albums.length} álbumes</p>
    ${a.albums.length ? '<div class="grid">' + a.albums.map(al => `<button class="card glass" data-album="${esc(al.name)}" data-by="${esc(a.name)}">
      <img src="${esc(al.thumb || '')}" loading="lazy" alt=""><div><b>${esc(al.name)}</b><small>${al.year || ''} · ${al.songs} canc.</small></div></button>`).join('') + '</div>' : ''}
    ${a.loose.length ? '<h2>Canciones</h2><div class="list">' + rows(a.loose) + '</div>' : ''}</div>`;
  scrollTo({top: 0});
}
async function showAlbum(artist, name) {
  const a = await api(`/album?artist=${encodeURIComponent(artist)}&name=${encodeURIComponent(name)}`);
  list = a.songs;
  wrap.innerHTML = `<div class="fade"><h2><button class="back glass" data-artist="${esc(a.artist)}" aria-label="Volver">←</button>${esc(a.name)}</h2>
    <p class="sub">${esc(a.artist)}${a.year ? ' · ' + a.year : ''} · ${a.songs.length} canciones</p><div class="list">${rows(a.songs)}</div></div>`;
  scrollTo({top: 0});
}

function go(t) {
  tab = t; page = null;
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
  scrollTo({top: 0});
  return {inicio, buscar, biblioteca}[t]();
}
$('nav').onclick = e => { const b = e.target.closest('button'); if (b) go(b.dataset.tab); };
wrap.addEventListener('click', e => {
  const h = e.target.closest('.heart[data-id]'); if (h) return toggleFav(list[+h.dataset.i]);
  const r = e.target.closest('.hit'); if (r) return playFrom(list, +r.dataset.i);
  const c = e.target.closest('[data-rail]'); if (c) return playFrom(rails[c.dataset.rail], +c.dataset.i);
  const t = e.target.closest('[data-artist]'); if (t) return showArtist(t.dataset.artist);
  const al = e.target.closest('[data-album]'); if (al) return showAlbum(al.dataset.by, al.dataset.album);
  if (e.target.closest('[data-back]')) return go(tab);
  const y = e.target.closest('.yt'); if (y) return searchYouTube(y);
});

// ---------- reproductor ----------
const audio = $('audio');
let cur = null, queue = [], qi = -1;
function playFrom(songs, i) { queue = songs.slice(); qi = i; start(); }
function start() {
  cur = queue[qi]; if (!cur) return;
  audio.src = `/stream/${encodeURIComponent(cur.id)}?token=${encodeURIComponent(session)}`;
  audio.play().catch(() => toast('No se pudo reproducir (¿el navegador no admite este audio?)'));
  $('bar').classList.add('on');
  $('pImg').src = cur.thumb || ''; $('pT').textContent = cur.title; $('pA').textContent = cur.artist || '';
  $('tint').style.backgroundImage = cur.thumb ? `url("${cur.thumb.replace(/"/g, '%22')}")` : 'none';
  $('tint').classList.toggle('on', !!cur.thumb);
  document.querySelectorAll('.row').forEach(r => r.classList.toggle('playing', r.querySelector('.heart')?.dataset.id === cur.id));
  paintHearts();
  if ('mediaSession' in navigator) {   // controles en la pantalla de bloqueo y en los auriculares
    navigator.mediaSession.metadata = new MediaMetadata({title: cur.title, artist: cur.artist || '', album: cur.album || '',
      artwork: cur.thumb ? [{src: cur.thumb, sizes: '480x360'}] : []});
  }
  if (cur.where === 'youtube') toast('La primera vez tarda unos segundos: se está guardando en el servidor');
}
const step = d => { if (queue.length) { qi = (qi + d + queue.length) % queue.length; start(); } };
$('next').onclick = () => step(1); $('prev').onclick = () => audio.currentTime > 4 ? (audio.currentTime = 0) : step(-1);
$('play').onclick = () => audio.paused ? audio.play() : audio.pause();
$('pFav').onclick = () => cur && toggleFav(cur);
audio.onended = () => step(1);
audio.onerror = () => { if (cur) toast('No se pudo reproducir «' + cur.title + '»'); };
const ico = p => $('playIco').innerHTML = p ? '<path d="M8 5v14l11-7z"/>' : '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>';
audio.onplay = () => ico(false); audio.onpause = () => ico(true);
audio.ontimeupdate = () => {
  const d = audio.duration || cur?.duration || 0;
  $('progI').style.width = d ? (100 * audio.currentTime / d) + '%' : 0;
  $('pTime').textContent = d ? `${dur(audio.currentTime) || '0:00'} / ${dur(d)}` : '';
};
$('prog').onclick = e => { const d = audio.duration; if (d) audio.currentTime = d * e.offsetX / e.currentTarget.offsetWidth; };
if ('mediaSession' in navigator) {
  navigator.mediaSession.setActionHandler('nexttrack', () => step(1));
  navigator.mediaSession.setActionHandler('previoustrack', () => step(-1));
  navigator.mediaSession.setActionHandler('play', () => audio.play());
  navigator.mediaSession.setActionHandler('pause', () => audio.pause());
}

(async () => {
  me = (await api('/me')).user || {};
  await loadFavs();
  go('inicio');
})();
</script>
