<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Música · TV</title>
<link rel="icon" href="/logo-96.webp" type="image/webp">
<script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
<style>
  /* La pantalla de la TV (receptor de Google Cast, App ID 25E4DFA9). La app manda la cola por Cast y desde allí se
     manejan pausa, siguiente, etc.; aquí solo se enseña lo que suena, para mirarlo de lejos en 16:9: el Canvas (o la
     portada que se mueve), título y artista grandes, la letra, la barra y "A continuación". Ligera a propósito (un
     Chromecast tiene poca potencia): el fondo difuminado es una imagen quieta y solo cambia de opacidad.
     En un parlante Cast (sin pantalla) solo suena: no se pide Canvas ni letra. El código está en tv.js (la CSP no deja
     código dentro de la página). Ver README.md, "Pantalla de la TV". */
  :root { --fondo: #0E0D16; --fondo-rgb: 14 13 22; --texto: #fff; --texto2: rgb(255 255 255 / .66); --acento: #9B5CF6; --acento-rgb: 155 92 246; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body { background: var(--fondo); color: var(--texto); font-family: Roboto, system-ui, sans-serif;   /* la de la TV: sin fuentes de fuera (CSP) */ overflow: hidden;
         -webkit-font-smoothing: antialiased; }
  .fondo { position: fixed; top: -8%; right: -8%; bottom: -8%; left: -8%; background-size: cover; background-position: center; filter: blur(70px) saturate(150%);
           opacity: .5; transition: background-image 600ms; animation: respira 9s ease-in-out infinite alternate; animation-play-state: paused; }
  .fondo::after { content: ""; position: absolute; top: 0; right: 0; bottom: 0; left: 0; background: linear-gradient(90deg, rgb(var(--fondo-rgb) / .35), rgb(var(--fondo-rgb) / .8)); }
  body.sonando .fondo { animation-play-state: running; }
  @keyframes respira { from { opacity: .38; } to { opacity: .62; } }

  /* márgenes seguros (~5 %): muchas TV recortan los bordes */
  .escena { position: relative; height: 100vh; display: grid; grid-template-columns: auto 1fr; gap: 5.5vw; align-items: center;
            padding: 7vh 7vw; }
  /* El marco es siempre vertical (9:16), con Canvas o sin él: así la pantalla no cambia de una canción a otra. Sin
     Canvas, la portada cuadrada en medio sobre ella misma difuminada (como Spotify). */
  .media { position: relative; height: 76vh; aspect-ratio: 9 / 16; border-radius: 2.2vh; overflow: hidden; background: #1c1930;
           box-shadow: 0 4vh 10vh rgb(0 0 0 / .55), 0 0 9vh rgb(var(--acento-rgb) / .16); }
  .media video, #tapaFondo { position: absolute; top: 0; right: 0; bottom: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
  #tapaFondo { filter: blur(3vh) saturate(140%); transform: scale(1.25); opacity: .75; }
  #tapa { position: absolute; left: 0; top: 50%; width: 100%; aspect-ratio: 1; margin-top: -50%; object-fit: cover;
          box-shadow: 0 2vh 6vh rgb(0 0 0 / .5); transform-origin: 50% 50%; animation: viva 24s ease-in-out infinite alternate;
          animation-play-state: paused; }
  body.sonando #tapa { animation-play-state: running; }
  @keyframes viva { 0% { transform: scale(1); } 50% { transform: scale(1.05) translate(1%, -1%); } 100% { transform: scale(1.08) translate(-1%, .5%); } }
  .media video { opacity: 0; transition: opacity 700ms; }
  .media.con-canvas video { opacity: 1; }
  .media.con-canvas img { opacity: 0; }
  .media img { transition: opacity 500ms; }

  .info { min-width: 0; display: flex; flex-direction: column; gap: 1.2vh; }
  .ahora { display: flex; align-items: center; gap: 1.2vh; color: var(--texto2); font-size: 2.1vh; font-weight: 600; letter-spacing: .1vh; }
  .eq { display: inline-flex; align-items: flex-end; gap: .4vh; height: 2.2vh; }
  .eq b { width: .45vh; height: 100%; border-radius: .3vh; background: var(--acento); transform-origin: bottom; transform: scaleY(.3);
          animation: eq 1s ease-in-out infinite alternate; animation-play-state: paused; }
  .eq b:nth-child(2) { animation-duration: .8s; animation-delay: -.3s; } .eq b:nth-child(3) { animation-duration: 1.2s; animation-delay: -.6s; }
  body.sonando .eq b { animation-play-state: running; }
  @keyframes eq { from { transform: scaleY(.25); } to { transform: scaleY(1); } }
  .pausa { display: none; padding: .5vh 1.4vh; border-radius: 99vh; background: rgb(255 255 255 / .12); color: var(--texto); font-size: 1.8vh; }
  body.en-pausa .pausa { display: inline-block; }
  h1 { font-size: 5.8vh; line-height: 1.08; font-weight: 800; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
  .artista { font-size: 3.8vh; color: var(--texto2); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .album { font-size: 2.4vh; color: var(--texto2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* la letra en un cuadrito de cristal (sin fondo se perdía sobre la portada difuminada) */
  /* altura fija (la actual hasta en 2 renglones y la siguiente en 1; lo que sobre, con "…"): si crecía con las líneas
     largas, la barra y "A continuación" se movían a cada rato */
  .letra { margin-top: 1.2vh; height: 16.5vh; overflow: hidden; display: flex; flex-direction: column; justify-content: center;
           padding: 1.6vh 2.4vh; border-radius: 1.8vh; background: rgb(0 0 0 / .28);
           -webkit-backdrop-filter: blur(2vh); backdrop-filter: blur(2vh); box-shadow: inset 0 0 0 .15vh rgb(255 255 255 / .08); }
  .letra:empty { display: none; }
  .letra p { font-size: 3.6vh; font-weight: 700; line-height: 1.25; transition: opacity 300ms;
             display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
  .letra p + p { font-size: 2.6vh; font-weight: 600; color: var(--texto2); margin-top: .8vh; -webkit-line-clamp: 1; }
  .barra { margin-top: 2.4vh; height: .8vh; border-radius: 1vh; background: rgb(255 255 255 / .16); overflow: hidden; }
  .barra i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--acento), rgb(var(--acento-rgb) / .65)); border-radius: inherit; }
  .tiempos { display: flex; justify-content: space-between; color: var(--texto2); font-size: 2vh; font-variant-numeric: tabular-nums; }
  /* A continuación: las próximas en una fila (se eligen con el control) */
  .cola { margin-top: 1.8vh; }
  .cola[hidden] { display: none; }
  .cola > small { display: block; color: var(--texto2); font-size: 1.8vh; font-weight: 600; letter-spacing: .15vh; text-transform: uppercase; margin-bottom: 1.2vh; }
  .cola-fila { display: flex; gap: 1.8vh; }
  .mini { width: 11.5vh; flex: none; border: 0; padding: 0; background: none; color: var(--texto); text-align: left; outline: none; transition: transform 150ms; }
  .mini img, .mini .ph { width: 11.5vh; height: 11.5vh; border-radius: 1.2vh; object-fit: cover; background: #1c1930; display: grid; place-items: center; font-size: 4vh; }
  .mini b { display: block; margin-top: .8vh; font-size: 1.8vh; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mini small { display: block; font-size: 1.5vh; color: var(--texto2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mini.todo .ph { background: rgb(255 255 255 / .1); font-size: 5vh; }
  .mini.f:focus img, .mini.f:focus .ph { box-shadow: 0 0 0 .45vh #fff, 0 1.2vh 3vh rgb(var(--acento-rgb) / .5); }

  /* botones (se manejan con el control remoto: el elegido, iluminado) */
  .controles { display: flex; align-items: center; gap: 2.4vh; margin-top: 2vh; }
  .controles button { width: 7.4vh; height: 7.4vh; border-radius: 50%; border: 0; display: grid; place-items: center; cursor: pointer;
                      background: rgb(255 255 255 / .1); color: var(--texto); font: 700 2.3vh Roboto, system-ui, sans-serif;
                      transition: transform 150ms, background 150ms, box-shadow 150ms; outline: none; }
  .controles button svg { width: 4vh; height: 4vh; }
  .controles button.grande { width: 10vh; height: 10vh; background: var(--acento); }
  .controles button.grande svg { width: 5.4vh; height: 5.4vh; }
  .controles button:focus { transform: scale(1.14); background: rgb(var(--acento-rgb) / .55);
                      box-shadow: 0 0 0 .5vh #fff, 0 1vh 4vh rgb(var(--acento-rgb) / .55); }
  .controles button.grande:focus { background: var(--acento); }
  /* ---- menús (Inicio, Biblioteca, Buscar, listas): se recorren con las flechas, el elegido iluminado ---- */
  .pestanas { position: fixed; top: 4vh; left: 7vw; z-index: 5; display: flex; gap: 1.2vh; }
  .pestanas button { padding: 1.2vh 2.6vh; border-radius: 99vh; border: 0; background: rgb(255 255 255 / .08); color: var(--texto2);
                     font: 600 2.3vh Roboto, system-ui, sans-serif; outline: none; transition: transform 150ms, background 150ms;
                     white-space: nowrap; word-break: keep-all; hyphens: none; letter-spacing: normal; flex: none; }
  .pestanas[hidden] { display: none; }
  .pestanas button.on { background: rgb(255 255 255 / .18); color: var(--texto); }
  .pestanas .salir { margin-left: 2.4vh; }
  .pestanas .salir.f:focus { background: rgb(220 60 70 / .75); }
  /* En los menús, la pantalla de Ahora se queda a la izquierda en pequeño (como el panel del reproductor de la web en el
     PC): portada o Canvas, título, artista, barra y botones; los menús, a la derecha. Sin nada sonando, menú entero. */
  body.con-menu .escena { position: fixed; left: 4vw; top: 12vh; bottom: 4vh; width: 24vw; height: auto; z-index: 2; display: flex;
                          flex-direction: column; align-items: stretch; gap: 1.6vh; padding: 2.4vh; border-radius: 2.4vh;
                          background: rgb(28 25 48 / .72); box-shadow: 0 2vh 6vh rgb(0 0 0 / .45); }
  /* como el reproductor de la web: el Canvas (o la portada) es el FONDO de todo el panel, de borde a borde, y el
     título, el artista y la barra van encima, abajo, con sombra en el texto y una capa casi transparente (sin caja).
     Medidas fijas (las del panel, 24vw × 84vh), no automáticas: estirado así la TV (Chrome 92) lo pintaba en blanco */
  body.con-menu .escena { overflow: hidden; justify-content: flex-end; }
  body.con-menu .media { position: absolute; top: 0; left: 0; width: 24vw; height: 84vh; aspect-ratio: auto; border-radius: 0; box-shadow: none; }
  body.con-menu .media::after { content: ""; position: absolute; top: 0; right: 0; bottom: 0; left: 0; z-index: 1;
                                background: linear-gradient(rgb(0 0 0 / 0) 55%, rgb(0 0 0 / .45)); }
  body.con-menu .info { position: relative; z-index: 2; gap: .8vh; padding: 0 1.2vh; text-shadow: 0 .2vh 1.4vh rgb(0 0 0 / .6); }
  body.con-menu .barra { box-shadow: 0 .2vh 1vh rgb(0 0 0 / .35); }
  body.con-menu .ahora, body.con-menu .album, body.con-menu .letra, body.con-menu .cola { display: none; }
  body.con-menu h1 { font-size: 3.2vh; }
  body.con-menu .artista { font-size: 2.2vh; }
  body.con-menu .barra { margin-top: 1vh; }
  body.con-menu .tiempos { font-size: 1.7vh; }
  body.con-menu .controles { display: none; }
  .panel-ir { display: none; }
  body.con-menu .panel-ir { display: block; position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 3; border: 0; border-radius: inherit; background: none; outline: none; }
  body.con-menu .panel-ir:focus { transform: none; }
  /* el borde de elegido, en el panel (por fuera): el vídeo de la TV se pinta por encima de lo que vaya sobre él */
  body.con-menu.panel-elegido .escena { box-shadow: 0 0 0 .5vh #fff, 0 0 6vh rgb(var(--acento-rgb) / .45); }
  body.con-menu:not(.con-cancion) .escena { display: none; }
  body.con-menu.con-pestanas .escena { padding: 2.4vh 2.4vh 2.6vh; }
  body.con-menu.con-cancion .menu { left: 30vw; }
  body.con-pestanas .escena { padding-top: 12vh; padding-bottom: 4vh; }
  .menu { position: fixed; top: 0; right: 0; bottom: 0; left: 0; padding: 12vh 0 0; overflow: hidden; z-index: 1; }
  .menu[hidden] { display: none; }
  /* arriba, aire para que lo elegido (que crece un 6 %) y los títulos de cada sección no se corten contra el borde */
  .menu .scroll { height: 100%; overflow-y: auto; scrollbar-width: none; padding: 2vh 7vw 8vh; scroll-padding: 11vh 0 8vh; }
  body.con-menu.con-cancion .menu .scroll { padding: 2vh 4vw 8vh 2vw; }
  body.con-menu.con-cancion .fila { margin: 0 -4vw 0 -2vw; padding: 2vh 4vw 2.6vh 2vw; scroll-padding: 0 4vw 0 2vw; }
  .menu .scroll::-webkit-scrollbar { display: none; }
  .menu h2 { font-size: 3vh; margin: 3vh 0 1.6vh; }
  .menu .scroll > h2:first-child { margin-top: 1vh; }
  .acciones.volver { margin: 0 0 3.4vh; }
  .menu .vacio { color: var(--texto2); font-size: 2.6vh; margin-top: 6vh; }
  /* las filas salen del margen hasta el borde de la pantalla (como Netflix o Spotify): la primera portada alineada con
     el título y, al moverse, la elegida entera (scroll-padding) */
  .fila { display: flex; gap: 2.6vh; overflow: hidden; margin: 0 -7vw; padding: 2vh 7vw 2.6vh; scroll-padding: 0 7vw; }
  .fila::after { content: ""; flex: none; width: 1px; }
  .rejilla { display: flex; flex-wrap: wrap; gap: 2.6vh; padding: 2vh 0 2.6vh; }
  .tarjeta { flex: none; width: 22vh; border: 0; padding: 0; background: none; color: var(--texto); text-align: left; outline: none;
             transition: transform 150ms; }
  .tarjeta img, .tarjeta .ph { width: 22vh; height: 22vh; border-radius: 1.6vh; object-fit: cover; background: #1c1930; display: grid;
                               place-items: center; font-size: 7vh; transition: box-shadow 150ms; }
  .tarjeta.redonda img { border-radius: 50%; }
  .tarjeta b { display: block; margin-top: 1.2vh; font-size: 2.2vh; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tarjeta small { display: block; font-size: 1.8vh; color: var(--texto2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cancion { display: flex; align-items: center; gap: 2vh; width: 100%; border: 0; padding: 1vh 1.4vh; border-radius: 1.4vh; outline: none;
             background: none; color: var(--texto); text-align: left; font: inherit; }
  .cancion img { width: 7vh; height: 7vh; border-radius: 1vh; object-fit: cover; background: #1c1930; flex: none; }
  .cancion div { flex: 1; min-width: 0; }
  .cancion b { display: block; font-size: 2.4vh; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cancion small { display: block; font-size: 1.9vh; color: var(--texto2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cancion span { color: var(--texto2); font-size: 2vh; font-variant-numeric: tabular-nums; }
  .cabecera { display: flex; align-items: flex-end; gap: 4vh; margin-bottom: 2vh; }
  .cabecera img { width: 26vh; height: 26vh; border-radius: 1.6vh; object-fit: cover; background: #1c1930; box-shadow: 0 2vh 6vh rgb(0 0 0 / .5); }
  .cabecera.redonda img { border-radius: 50%; }
  .cabecera h1 { font-size: 6vh; } .cabecera p { color: var(--texto2); font-size: 2.4vh; margin-top: 1vh; }
  .acciones { display: flex; gap: 2vh; margin-top: 2.4vh; }
  .pill { padding: 1.4vh 3vh; border-radius: 99vh; border: 0; background: rgb(255 255 255 / .1); color: var(--texto);
          font: 700 2.3vh Roboto, system-ui, sans-serif; outline: none; transition: transform 150ms; }
  .pill.main { background: var(--acento); }
  .teclado { display: grid; grid-template-columns: repeat(10, 6.4vh); gap: 1vh; margin: 1.6vh 0; }
  .teclado button { height: 6.4vh; border: 0; border-radius: 1vh; background: rgb(255 255 255 / .08); color: var(--texto);
                    font: 700 2.6vh Roboto, system-ui, sans-serif; outline: none; }
  .teclado button.ancha { grid-column: span 3; font-size: 2vh; }
  .consulta { font-size: 4vh; font-weight: 800; min-height: 5vh; border-bottom: .3vh solid rgb(255 255 255 / .2); padding-bottom: 1vh; }
  .consulta:empty::before { content: "Escribe con las flechas y OK"; color: var(--texto2); font-weight: 400; font-size: 2.6vh; }
  /* saludo y accesos rápidos de Inicio (como Spotify) */
  .saludo { font-size: 4.4vh; font-weight: 800; margin: 2vh 0 1vh; }
  .accesos { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.8vh; padding: 1.4vh 0 1vh; }
  .acceso { display: flex; align-items: center; gap: 1.8vh; height: 9vh; border: 0; border-radius: 1.2vh; overflow: hidden; padding: 0 1.6vh 0 0;
            background: rgb(255 255 255 / .08); color: var(--texto); text-align: left; font: 700 2.2vh Roboto, system-ui, sans-serif; outline: none; }
  .acceso img, .acceso .ph { width: 9vh; height: 9vh; object-fit: cover; background: #2a2440; display: grid; place-items: center; font-size: 3.4vh; flex: none; }
  .acceso span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .acceso.f:focus { background: rgb(var(--acento-rgb) / .45); box-shadow: 0 0 0 .4vh #fff; transform: scale(1.03); }
  /* número de cada canción y la que suena */
  .cancion .n { width: 4vh; text-align: right; color: var(--texto2); font-size: 2vh; flex: none; }
  .cancion.sonando b, .cancion.sonando .n { color: var(--acento); }
  /* lo elegido con el control: un poco más grande y con borde blanco */
  .f:focus { transform: scale(1.06); }
  .pestanas .f:focus, .pill.f:focus, .teclado .f:focus { background: rgb(var(--acento-rgb) / .6); color: #fff; box-shadow: 0 0 0 .4vh #fff; }
  .tarjeta.f:focus img, .tarjeta.f:focus .ph { box-shadow: 0 0 0 .5vh #fff, 0 1.6vh 4vh rgb(var(--acento-rgb) / .5); }
  .cancion.f:focus { transform: none; background: rgb(var(--acento-rgb) / .35); box-shadow: inset 0 0 0 .3vh #fff; }
  /* elegir qué hacer con una canción si ya suena algo */
  #eleccion { position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 20; display: grid; place-items: center; background: rgb(0 0 0 / .55); }
  #eleccion .caja { display: flex; flex-direction: column; gap: 1.4vh; min-width: 46vh; max-width: 70vw; padding: 3.4vh 3.6vh;
                    border-radius: 2.4vh; background: #1c1930; box-shadow: 0 3vh 8vh rgb(0 0 0 / .6); }
  #eleccion .caja > b { font-size: 3.2vh; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #eleccion .caja > small { font-size: 2.2vh; color: var(--texto2); margin: -.6vh 0 1vh; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #eleccion button { padding: 1.8vh 2.4vh; border: 0; border-radius: 1.4vh; background: rgb(255 255 255 / .08); color: var(--texto);
                     font: 700 2.6vh Roboto, system-ui, sans-serif; text-align: left; outline: none; }
  #eleccion button small { font-weight: 400; font-size: 2vh; color: var(--texto2); margin-left: 1vh; }
  #eleccion button.f:focus { background: var(--acento); color: #fff; transform: none; box-shadow: 0 0 0 .4vh #fff; }
  /* aviso del control remoto */
  .aviso { position: fixed; left: 50%; bottom: 12vh; transform: translateX(-50%) scale(.9); padding: 2vh 4vh; border-radius: 99vh;
           background: rgb(0 0 0 / .55); font-size: 5vh; font-weight: 800; opacity: 0; transition: opacity 200ms, transform 200ms; pointer-events: none; }
  .aviso.on { opacity: 1; transform: translateX(-50%) scale(1); }
  /* sin nada sonando */
  .espera { position: fixed; top: 0; right: 0; bottom: 0; left: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2.6vh;
            background: var(--fondo); text-align: center; transition: opacity 500ms; }
  .espera img { width: 20vh; height: 20vh; border-radius: 50%; box-shadow: 0 2vh 8vh rgb(var(--acento-rgb) / .35); }
  .espera b { font-size: 4.4vh; } .espera span { font-size: 2.4vh; color: var(--texto2); }
  body.con-cancion .espera, body.con-pestanas .espera { opacity: 0; pointer-events: none; }
  body.solo-audio * { animation: none !important; }
  /* ---- Ahora con el estilo de la web (07-11-2026): el Canvas grande a la derecha, de arriba abajo (medidas FIJAS:
     automáticas, esta TV lo pintaba en blanco); a la izquierda dónde suena, portada pequeña con título, la letra
     (anterior, actual y siguiente), la barra, los botones y "A continuación" compacta. Entra animado. ---- */
  body:not(.con-menu) .escena { grid-template-columns: minmax(0, 1fr) auto; gap: 3vw; align-items: center; padding: 4vh 3vw 4vh 4.5vw; }
  body.con-pestanas:not(.con-menu) .escena { padding-top: 11vh; padding-bottom: 3vh; }
  /* el marco del Canvas, como el que funcionaba en esta TV: 9:16 por su alto (con otras proporciones, o animado, el
     vídeo salía en BLANCO en la TV, 07-11-2026) */
  body:not(.con-menu) .media { order: 2; height: 92vh; aspect-ratio: 9 / 16; border-radius: 2.6vh; }
  body.con-pestanas:not(.con-menu) .media { height: 86vh; }
  /* Letra | Cola (como la pestaña Ahora de la web): una u otra; con la Cola, fuera "A continuación" y la lista más alta */
  .panel-lc { border-radius: 2vh; background: rgb(0 0 0 / .26); box-shadow: inset 0 0 0 .15vh rgb(255 255 255 / .08); overflow: hidden; }
  body.con-menu .panel-lc { display: none; }
  .tabs-ahora { display: flex; gap: .6vh; padding: .8vh 1.6vh 0; border-bottom: .15vh solid rgb(255 255 255 / .1); }
  .tabs-ahora button { padding: 1vh 1.8vh 1.2vh; border: 0; background: none; color: var(--texto2); font: 700 2.1vh Roboto, system-ui, sans-serif;
                       border-bottom: .4vh solid transparent; outline: none; border-radius: 1vh 1vh 0 0; }
  .tabs-ahora button.on { color: var(--texto); border-bottom-color: var(--acento); }
  .tabs-ahora button.f:focus { background: rgb(var(--acento-rgb) / .45); color: #fff; }
  .tabs-ahora span { color: var(--texto2); font-weight: 600; }
  .panel-lc .letra { margin-top: 0; border-radius: 0; background: none; box-shadow: none; -webkit-backdrop-filter: none; backdrop-filter: none; }
  .panel-lc .letra:empty { display: flex; }
  .cola-lista { display: none; height: 34vh; overflow-y: auto; scrollbar-width: none; padding: .6vh .8vh; }
  .cola-lista::-webkit-scrollbar { display: none; }
  body.ahora-cola .panel-lc .letra { display: none; }
  body.ahora-cola .cola-lista { display: block; }
  body.ahora-cola:not(.con-menu) .cola { display: none; }
  .cola-lista .cancion { padding: .7vh 1vh; } .cola-lista .cancion img { width: 5.6vh; height: 5.6vh; }
  .cola-lista .cancion b { font-size: 2.1vh; } .cola-lista .cancion small { font-size: 1.7vh; }
  .cancion-f { display: flex; align-items: center; gap: 2.4vh; }
  #tapaMini { width: 13vh; height: 13vh; border-radius: 1.6vh; object-fit: cover; background: #1c1930; flex: none; box-shadow: 0 1.4vh 3vh rgb(0 0 0 / .35); }
  .cancion-f .txt { min-width: 0; display: flex; flex-direction: column; gap: .4vh; }
  body.con-menu #tapaMini { display: none; }
  body:not(.con-menu) .letra { height: 18vh; }
  .letra p.antes, .letra p.luego { font-size: 2.3vh; font-weight: 600; color: var(--texto2); -webkit-line-clamp: 1; margin: 0; }
  .letra p.ahora { font-size: 3.4vh; font-weight: 800; color: var(--texto); margin: .7vh 0; -webkit-line-clamp: 2; }
  /* A continuación compacta: 4 en fila (portada pequeña y texto al lado) y Lista completa */
  body:not(.con-menu) .cola-fila { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)) auto; gap: 1.4vh; }
  body:not(.con-menu) .mini { width: auto; min-width: 0; display: flex; align-items: center; gap: 1.2vh; padding: .6vh; border-radius: 1.2vh; }
  body:not(.con-menu) .mini img, body:not(.con-menu) .mini .ph { width: 7.5vh; height: 7.5vh; flex: none; font-size: 3vh; }
  body:not(.con-menu) .mini > b, body:not(.con-menu) .mini > small { display: none; }
  .mini .tx { min-width: 0; } .mini .tx b { display: block; margin: 0; font-size: 1.8vh; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mini .tx small { display: block; font-size: 1.5vh; color: var(--texto2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  body:not(.con-menu) .mini.f:focus { background: rgb(var(--acento-rgb) / .3); box-shadow: inset 0 0 0 .3vh #fff; transform: none; }
  body:not(.con-menu) .mini.f:focus :is(img, .ph) { box-shadow: none; }
  /* entrada: el Canvas desde la derecha creciendo; la izquierda en cascada (sin desenfoque: Chrome 92) */
  @keyframes entraCanvas { from { opacity: 0; transform: translateX(5vw) scale(.94); } }
  @keyframes sube { from { opacity: 0; transform: translateY(2.4vh); } }
  /* (el Canvas, sin animación: animado salía en blanco en la TV) */
  body:not(.con-menu) .escena.entra .info > * { animation: sube 560ms cubic-bezier(.2, .8, .2, 1) both; }
  .escena.entra .info > :nth-child(2) { animation-delay: 60ms; } .escena.entra .info > :nth-child(3) { animation-delay: 120ms; }
  .escena.entra .info > :nth-child(4) { animation-delay: 180ms; } .escena.entra .info > :nth-child(5) { animation-delay: 230ms; }
  .escena.entra .info > :nth-child(6) { animation-delay: 280ms; } .escena.entra .info > :nth-child(7) { animation-delay: 330ms; }
  body.solo-audio .escena.entra * { animation: none !important; }

  #audio { position: fixed; left: 0; top: 0; width: 2px; height: 2px; opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<!-- el reproductor, el primero y el único elemento de medios al arrancar: es el que maneja Cast (el vídeo del Canvas
     lo crea tv.js después; si estuviera aquí, Cast podía cogerlo a él: sin sonido, 7 s y a la siguiente, 06-11-2026).
     Es un <video> invisible aunque solo suene audio: con <audio>, en la Chromecast con Google TV Cast ponía al pausar
     SU interfaz encima (título, barra blanca) y se quedaba el control remoto ("la interfaz de serie reemplaza a la
     propia cuando suena audio", según Google). Prueba del 06-11-2026. -->
<video id="audio" preload="auto" playsinline></video>
<div class="fondo" id="fondo"></div>
<!-- pestañas (salen cuando la TV tiene la llave: entonces es independiente) -->
<nav class="pestanas" id="pestanas" hidden>
  <button class="f" data-vista="ahora">Ahora</button><button class="f" data-vista="inicio">Inicio</button>
  <button class="f" data-vista="biblioteca">Biblioteca</button><button class="f" data-vista="buscar">Buscar</button><button class="f salir" data-salir>⏻ Salir</button>
</nav>
<section class="menu" id="menu" hidden></section>

<main class="escena" id="ahora">
  <!-- en los menús, el panel de la izquierda es solo información: entero se elige con el control y OK lleva a Ahora -->
  <button class="panel-ir f" id="panelIr" aria-label="Ir a la pantalla de lo que suena"></button>
  <div class="media" id="media"><img id="tapaFondo" alt=""><img id="tapa" alt=""></div>
  <div class="info">
    <div class="ahora"><i class="eq"><b></b><b></b><b></b></i><span id="dondeSuena">Sonando en la TV</span><span class="pausa">En pausa</span></div>
    <div class="cancion-f"><img id="tapaMini" alt=""><div class="txt"><h1 id="titulo"></h1>
      <div class="artista" id="artista"></div><div class="album" id="album"></div></div></div>
    <div class="panel-lc"><div class="tabs-ahora" id="tabsAhora"><button class="f on" data-pv="letra">Letra</button><button class="f" data-pv="cola">Cola <span id="colaN"></span></button></div>
      <div class="letra" id="letra"></div><div class="cola-lista" id="colaLista"></div></div>
    <div class="barra"><i id="progreso"></i></div>
    <div class="tiempos"><span id="actual">0:00</span><span id="total">0:00</span></div>
    <!-- botones para el control remoto: ← → para elegir, OK para pulsar -->
    <div class="controles" id="controles">
      <button class="f" data-a="menos10" aria-label="Atrás 10 segundos"><span>−10</span></button>
      <button class="f" data-a="anterior" aria-label="Anterior"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
      <button class="f grande" data-a="playpausa" id="bPlay" aria-label="Pausa"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg></button>
      <button class="f" data-a="siguiente" aria-label="Siguiente"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
      <button class="f" data-a="mas10" aria-label="Adelante 10 segundos"><span>+10</span></button>
    </div>
    <div class="cola" id="cola" hidden><small>A continuación</small><div class="cola-fila" id="colaFila"></div></div>
  </div>
</main>
<div class="aviso" id="aviso"></div>
<div class="espera" id="espera"><img src="/logo-480.webp" alt=""><b>Música</b><span>Elige una canción en la app y mándala a la TV</span></div>
<script src="/tv/tv.js"></script>
</body>
</html>
